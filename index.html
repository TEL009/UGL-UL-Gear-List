    function TableView({
      records, allRecords, codes, dealerGroups, kinds, tags, customerOptions, contactOptions, chargeOptions, modelOptions, columnOrder, hiddenColumns, columnWidths,
      columnSort, columnFilters, onSetSort, onSetFilter, onClearFilter, onToggleHidden,
      onReorderColumns, onSetColumnWidth,
      onEdit, onDelete, onOpenEquip, onUpdateField, onUpdateDateTime, getStatusesForKind, getColor, onSetOptionColor,
      onReorderCustomerOptions, onReorderContactOptions, onReorderChargeOptions, onReorderModelOptions, onReorderTags, onReorderKinds,
      onRemoveCustomerOption, onRemoveContactOption, onRemoveChargeOption, onRemoveModelOption,
      onUploadAttachment, onSaveAttachments,
    }) {
      const [activeCell, setActiveCell] = useState(null);
      const [activeHeaderMenu, setActiveHeaderMenu] = useState(null); // { key: string, rect: DOMRect }
      const [resizing, setResizing] = useState(null);
      const [liveWidth, setLiveWidth] = useState(null);
      const [copiedCode, setCopiedCode] = useState(null); // 直近でコピーしたコード(ポップアップの代わりに文言だけ一時的に切り替える)
      const [dragOverRowId, setDragOverRowId] = useState(null);
      const [attachPopoverFor, setAttachPopoverFor] = useState(null); // { record, rect }
      const [uploadingRowId, setUploadingRowId] = useState(null);

      const uploadFilesToRecord = async (record, fileList) => {
        const files = Array.from(fileList || []);
        if (files.length === 0) return;
        setUploadingRowId(record.id);
        let current = record.attachments || [];
        for (const file of files) {
          try {
            const added = await onUploadAttachment(record.id, current, file);
            if (added) {
              current = [...current, added];
              setAttachPopoverFor(prev => (prev && prev.record.id === record.id) ? { ...prev, record: { ...prev.record, attachments: current } } : prev);
            }
          } catch (e) {
            console.error(e);
            alert(`「${file.name}」のアップロードに失敗しました: ${e.message}`);
          }
        }
        setUploadingRowId(null);
      };

      const handleCopyCode = (code) => {
        copyToClipboard(code);
        setCopiedCode(code);
        setTimeout(() => setCopiedCode(c => c === code ? null : c), 1200);
      };

      const visibleColumns = useMemo(
        () => columnOrder.filter(k => TABLE_COLUMN_DEFS[k] && !hiddenColumns.includes(k)),
        [columnOrder, hiddenColumns]
      );

      const widthFor = (key) => {
        if (liveWidth && liveWidth.key === key) return liveWidth.width;
        return columnWidths[key] || DEFAULT_COLUMN_WIDTHS[key] || 140;
      };

      useEffect(() => {
        if (!resizing) return;
        const onMove = (e) => {
          const delta = e.clientX - resizing.startX;
          const next = Math.max(MIN_COL_WIDTH, resizing.startWidth + delta);
          setLiveWidth({ key: resizing.key, width: next });
        };
        const onUp = () => {
          setLiveWidth(cur => {
            if (cur) onSetColumnWidth(cur.key, cur.width);
            return null;
          });
          setResizing(null);
        };
        window.addEventListener("mousemove", onMove);
        window.addEventListener("mouseup", onUp);
        return () => {
          window.removeEventListener("mousemove", onMove);
          window.removeEventListener("mouseup", onUp);
        };
      }, [resizing, onSetColumnWidth]);

      const startResize = (e, key) => {
        e.preventDefault();
        e.stopPropagation();
        setResizing({ key, startX: e.clientX, startWidth: widthFor(key) });
      };

      // セルの中身(文字列・タグ)の長さに応じて、その列にちょうど収まる幅を計算する(Excelのダブルクリック相当)
      const PILL_COLUMNS = new Set(["kind", "customer", "contactName", "personInCharge", "model", "tag", "status"]);
      const measureCtxRef = useRef(null);
      const getCellRawText = (key, r) => {
        switch (key) {
          case "subject": return r.subject || "";
          case "kind": return r.kind || "";
          case "customer": return r.customer || "";
          case "contactName": return r.contactName || "";
          case "personInCharge": return r.personInCharge || "";
          case "model": return r.model || "";
          case "serialYear": return r.serialYear || "";
          case "content": return r.content || "";
          case "receivedDate": return r.receivedDate ? `${fmtJP(r.receivedDate, r.receivedTime)}` : "";
          case "visitDate": return r.visitDate ? fmtJPRange(r.visitDate, r.visitTime, r.visitEndDate) : "";
          case "workDate": return r.workDate ? fmtJPRange(r.workDate, r.workTime, r.workEndDate) : "";
          case "tag": return r.tag || "";
          case "code": {
            const dealer = r.code ? dealerFor(r.code, dealerGroups) : null;
            return r.code ? `${r.code}${dealer ? " " + dealer.name : ""}` : "";
          }
          case "precheckDate": return r.precheckDate ? fmtJPRange(r.precheckDate, r.precheckTime, r.precheckEndDate) : "";
          case "honkouseiDate": return r.honkouseiDate ? fmtJPRange(r.honkouseiDate, r.honkouseiTime, r.honkouseiEndDate) : "";
          case "status": return r.status || "";
          default: return "";
        }
      };

      const autoFitColumn = (key) => {
        if (!measureCtxRef.current) {
          const canvas = document.createElement("canvas");
          measureCtxRef.current = canvas.getContext("2d");
        }
        const ctx = measureCtxRef.current;
        ctx.font = "13px 'IBM Plex Sans JP', 'Hiragino Sans', sans-serif";
        const def = TABLE_COLUMN_DEFS[key];
        const isPill = PILL_COLUMNS.has(key);
        // ヘッダーラベル自身の幅も考慮する(ソート・フィルターアイコン分の余白込み)
        let maxTextWidth = ctx.measureText(def?.label || "").width + 28;
        // 内容が空(＋)の列は自動フィットしても意味がないので通常の行だけ見る
        for (const r of allRecords) {
          const text = getCellRawText(key, r);
          if (!text) continue;
          const w = ctx.measureText(text).width;
          if (w > maxTextWidth) maxTextWidth = w;
        }
        const padding = isPill ? 34 : 24; // ピル(タグ風バッジ)は左右の余白・角丸分を多めに確保
        const computed = Math.ceil(maxTextWidth + padding);
        const MAX_AUTO_WIDTH = key === "content" ? 420 : 320;
        const finalWidth = Math.max(MIN_COL_WIDTH, Math.min(MAX_AUTO_WIDTH, computed));
        onSetColumnWidth(key, finalWidth);
      };

      if (records.length === 0 && allRecords.length === 0) {
        return (
          <div style={styles.empty}>
            <div style={styles.emptyTitle}>まだ登録がありません</div>
            <div style={styles.emptySub}>「新規登録」から校正・修理対応の予定を追加してください。</div>
          </div>
        );
      }

      const openCell = (e, id, field) => {
        e.stopPropagation();
        setActiveCell({ id, field, rect: e.currentTarget.getBoundingClientRect() });
      };
      const activeRecord = activeCell ? records.find(r => r.id === activeCell.id) : null;

      const openHeaderMenu = (e, key) => {
        e.stopPropagation();
        setActiveHeaderMenu({ key, rect: e.currentTarget.getBoundingClientRect() });
      };

      const getUniqueValuesForCol = (key) => {
        const set = new Set();
        allRecords.forEach(r => {
          if (r[key]) set.add(r[key]);
        });
        return Array.from(set);
      };

      const renderCellContent = (key, r) => {
        switch (key) {
          case "subject":
            return r.subject || <span className="ledger-empty-plus">＋</span>;
          case "kind":
            return r.kind
              ? <span style={{ ...styles.pill, background: getColor(r.kind, 0) }}>{r.kind}</span>
              : <span className="ledger-empty-plus">＋</span>;
          case "customer":
            return r.customer
              ? <span style={{ ...styles.pill, background: getColor(r.customer, customerOptions.indexOf(r.customer)) }}>{r.customer}</span>
              : <span className="ledger-empty-plus">＋</span>;
          case "contactName":
            return r.contactName
              ? <span style={{ ...styles.pill, background: getColor(r.contactName, contactOptions.indexOf(r.contactName)) }}>{r.contactName}</span>
              : <span className="ledger-empty-plus">＋</span>;
          case "personInCharge":
            return r.personInCharge
              ? <span style={{ ...styles.pill, background: getColor(r.personInCharge, chargeOptions.indexOf(r.personInCharge)) }}>{r.personInCharge}</span>
              : <span className="ledger-empty-plus">＋</span>;
          case "model":
            return r.model
              ? <span style={{ ...styles.pill, background: getColor(r.model, modelOptions.indexOf(r.model)) }}>{r.model}</span>
              : <span className="ledger-empty-plus">＋</span>;
          case "serialYear":
            return r.serialYear || <span className="ledger-empty-plus">＋</span>;
          case "content":
            return r.content
              ? <span style={styles.tdTruncate}>{r.content}</span>
              : <span className="ledger-empty-plus">＋</span>;
          case "receivedDate":
            return r.receivedDate ? fmtJP(r.receivedDate, r.receivedTime) : <span className="ledger-empty-plus">＋</span>;
          case "visitDate":
            return r.visitDate ? fmtJPRange(r.visitDate, r.visitTime, r.visitEndDate) : <span className="ledger-empty-plus">＋</span>;
          case "workDate":
            return r.workDate ? fmtJPRange(r.workDate, r.workTime, r.workEndDate) : <span className="ledger-empty-plus">＋</span>;
          case "tag":
            return r.tag
              ? <span style={{ ...styles.pill, background: getColor(r.tag, tags.indexOf(r.tag)) }}>{r.tag}</span>
              : <span className="ledger-empty-plus">＋</span>;
          case "code":
            return (
              <span
                style={{ fontFamily: "'IBM Plex Mono', monospace", color: copiedCode === r.code ? "#2f8f5b" : "var(--clr8f8a7c)", cursor: "pointer" }}
                onClick={(e) => { e.stopPropagation(); if (r.code) handleCopyCode(r.code); }}
                title="クリックでコードをコピー"
              >
                {copiedCode === r.code ? (
                  <>✓ コピーしました</>
                ) : (
                  <>
                    {r.code || "—"}
                    {r.code && dealerFor(r.code, dealerGroups) && <span style={styles.tdDealer}> {dealerFor(r.code, dealerGroups).name}</span>}
                  </>
                )}
              </span>
            );
          case "precheckDate":
            return r.precheckDate ? fmtJPRange(r.precheckDate, r.precheckTime, r.precheckEndDate) : <span className="ledger-empty-plus">＋</span>;
          case "honkouseiDate":
            return r.honkouseiDate ? fmtJPRange(r.honkouseiDate, r.honkouseiTime, r.honkouseiEndDate) : <span className="ledger-empty-plus">＋</span>;
          case "status":
            const currentStatuses = getStatusesForKind(r.kind || "校正");
            return r.status
              ? <span style={{ ...styles.pill, background: getColor(r.status, currentStatuses.indexOf(r.status)) }}>{r.status}</span>
              : <span className="ledger-empty-plus">＋</span>;
          default:
            return null;
        }
      };

      return (
        <div style={styles.tableWrap}>
          <table style={{ ...styles.table, tableLayout: "fixed" }}>
            <colgroup>
              <col style={{ width: 80 }} />
              {visibleColumns.map(key => <col key={key} style={{ width: widthFor(key) }} />)}
            </colgroup>
            <thead>
              <tr>
                <th className="ledger-th ledger-sticky-cell" style={{ ...styles.th, ...styles.thSticky }}></th>
                {visibleColumns.map((key) => {
                  const def = TABLE_COLUMN_DEFS[key];
                  const hasSort = columnSort?.key === key;
                  const hasFilter = !!columnFilters[key];

                  return (
                    <th
                      key={key}
                      className="ledger-th"
                      style={{
                        ...styles.th,
                        position: "relative",
                        ...(hasSort || hasFilter ? styles.thActiveFilter : {})
                      }}
                      onClick={(e) => openHeaderMenu(e, key)}
                      title="クリックして並び替え・フィルターメニューを開く"
                    >
                      <div style={styles.thLabelWrap}>
                        <span style={styles.thLabelText}>{def.label}</span>
                        {hasSort && (
                          <span style={styles.thIndicator}>
                            {columnSort.direction === "asc" ? <ArrowUp size={11} color={amber} /> : <ArrowDown size={11} color={amber} />}
                          </span>
                        )}
                        {hasFilter && (
                          <span style={styles.thIndicator}>
                            <Filter size={11} color={amber} />
                          </span>
                        )}
                      </div>
                      <div
                        className="col-resize-handle"
                        style={styles.colResizeHandle}
                        onMouseDown={(e) => startResize(e, key)}
                        onClick={(e) => e.stopPropagation()}
                        onDoubleClick={(e) => { e.preventDefault(); e.stopPropagation(); autoFitColumn(key); }}
                        title="ドラッグでリサイズ / ダブルクリックで幅を自動調整"
                      />
                    </th>
                  );
                })}
              </tr>
            </thead>
            <tbody>
              {records.map((r) => (
                <tr key={r.id} className="ledger-row" style={styles.tr}>
                  <td
                    className="ledger-sticky-cell"
                    style={{
                      ...styles.td, ...styles.tdSticky, padding: "8px 10px",
                      ...(dragOverRowId === r.id ? { background: "rgba(198,138,61,0.18)", boxShadow: "inset 0 0 0 2px var(--clrc68a3d)" } : {}),
                    }}
                    onDragOver={(e) => { e.preventDefault(); setDragOverRowId(r.id); }}
                    onDragLeave={() => setDragOverRowId(id => (id === r.id ? null : id))}
                    onDrop={(e) => {
                      e.preventDefault();
                      setDragOverRowId(null);
                      uploadFilesToRecord(r, e.dataTransfer.files);
                    }}
                    title="ここにファイルをドラッグ＆ドロップすると添付できます"
                  >
                    <div className="ledger-actions" style={styles.actionsGrid}>
                      <button style={styles.iconBtnSm} onClick={() => onEdit(r)} title="詳細編集">
                        <Pencil size={13} />
                      </button>
                      <button style={styles.iconBtnSm} onClick={() => onOpenEquip(r)} title="機器点検票">
                        <ClipboardList size={13} />
                      </button>
                      <button
                        style={{ ...styles.iconBtnSm, position: "relative" }}
                        onClick={(e) => setAttachPopoverFor({ record: r, rect: e.currentTarget.getBoundingClientRect() })}
                        title="添付ファイル（ドラッグ＆ドロップでも追加可）"
                        disabled={uploadingRowId === r.id}
                      >
                        <Paperclip size={13} />
                        {(r.attachments && r.attachments.length > 0) && (
                          <span style={styles.attachCountBadge}>{r.attachments.length}</span>
                        )}
                      </button>
                      <button style={styles.iconBtnSm} onClick={() => onDelete(r.id)} title="削除">
                        <Trash2 size={13} />
                      </button>
                    </div>
                  </td>
                  {visibleColumns.map((key) => {
                    const def = TABLE_COLUMN_DEFS[key];
                    const cellStyle = {
                      ...styles.td,
                      ...(def.editable ? styles.tdEditable : {}),
                      ...(def.bold ? { fontWeight: 600, fontSize: 13.5, color: ink } : {}),
                      overflow: "hidden", textOverflow: "ellipsis", whiteSpace: def.editable === "textarea" ? "normal" : "nowrap",
                    };
                    return (
                      <td
                        key={key}
                        className={def.editable ? "ledger-cell-editable" : undefined}
                        style={cellStyle}
                        onClick={def.editable ? (e) => openCell(e, r.id, key) : undefined}
                      >
                        {renderCellContent(key, r)}
                      </td>
                    );
                  })}
                </tr>
              ))}
            </tbody>
          </table>

          {/* Notion Header Popover Menu */}
          {activeHeaderMenu && (
            <ColumnHeaderMenuPopover
              colKey={activeHeaderMenu.key}
              label={TABLE_COLUMN_DEFS[activeHeaderMenu.key]?.label}
              rect={activeHeaderMenu.rect}
              sort={columnSort}
              filter={columnFilters[activeHeaderMenu.key]}
              uniqueValues={getUniqueValuesForCol(activeHeaderMenu.key)}
              onSetSort={onSetSort}
              onSetFilter={onSetFilter}
              onClearFilter={onClearFilter}
              onHideColumn={onToggleHidden}
              onClose={() => setActiveHeaderMenu(null)}
            />
          )}

          {attachPopoverFor && (
            <AttachmentCellPopover
              record={attachPopoverFor.record}
              rect={attachPopoverFor.rect}
              uploading={uploadingRowId === attachPopoverFor.record.id}
              onUploadFiles={(files) => uploadFilesToRecord(attachPopoverFor.record, files)}
              onRemove={(attachmentId) => {
                const next = (attachPopoverFor.record.attachments || []).filter(a => a.id !== attachmentId);
                onSaveAttachments(attachPopoverFor.record.id, next);
                setAttachPopoverFor(prev => prev ? { ...prev, record: { ...prev.record, attachments: next } } : prev);
              }}
              onClose={() => setAttachPopoverFor(null)}
            />
          )}

          {activeCell && activeRecord && activeCell.field === "subject" && (
            <TextCellPopover
              initialValue={activeRecord.subject}
              rect={activeCell.rect}
              onSave={(v) => onUpdateField(activeRecord.id, "subject", v)}
              onClose={() => setActiveCell(null)}
            />
          )}
          {activeCell && activeRecord && activeCell.field === "kind" && (
            <SelectCellPopover
              value={activeRecord.kind}
              rect={activeCell.rect}
              options={kinds.map(k => k.name)}
              colorFn={(v) => getColor(v, 0)}
              onSetColor={onSetOptionColor}
              allowCreate={false}
              onSelect={(v) => onUpdateField(activeRecord.id, "kind", v)}
              onReorder={onReorderKinds}
              onClose={() => setActiveCell(null)}
            />
          )}
          {activeCell && activeRecord && activeCell.field === "contactName" && (
            <SelectCellPopover
              value={activeRecord.contactName}
              rect={activeCell.rect}
              options={contactOptions}
              colorFn={(v) => getColor(v, contactOptions.indexOf(v))}
              onSetColor={onSetOptionColor}
              allowCreate={true}
              onSelect={(v) => onUpdateField(activeRecord.id, "contactName", v)}
              onReorder={onReorderContactOptions}
              onRemoveOption={onRemoveContactOption}
              onClose={() => setActiveCell(null)}
            />
          )}
          {activeCell && activeRecord && activeCell.field === "personInCharge" && (
            <SelectCellPopover
              value={activeRecord.personInCharge}
              rect={activeCell.rect}
              options={chargeOptions}
              colorFn={(v) => getColor(v, chargeOptions.indexOf(v))}
              onSetColor={onSetOptionColor}
              allowCreate={true}
              onSelect={(v) => onUpdateField(activeRecord.id, "personInCharge", v)}
              onReorder={onReorderChargeOptions}
              onRemoveOption={onRemoveChargeOption}
              onClose={() => setActiveCell(null)}
            />
          )}
          {activeCell && activeRecord && activeCell.field === "model" && (
            <SelectCellPopover
              value={activeRecord.model}
              rect={activeCell.rect}
              options={modelOptions}
              colorFn={(v) => getColor(v, modelOptions.indexOf(v))}
              onSetColor={onSetOptionColor}
              allowCreate={true}
              onSelect={(v) => onUpdateField(activeRecord.id, "model", v)}
              onReorder={onReorderModelOptions}
              onRemoveOption={onRemoveModelOption}
              onClose={() => setActiveCell(null)}
            />
          )}
          {activeCell && activeRecord && activeCell.field === "serialYear" && (
            <TextCellPopover
              initialValue={activeRecord.serialYear}
              rect={activeCell.rect}
              onSave={(v) => onUpdateField(activeRecord.id, "serialYear", toHalfWidth(v))}
              onClose={() => setActiveCell(null)}
            />
          )}
          {activeCell && activeRecord && activeCell.field === "content" && (
            <TextCellPopover
              initialValue={activeRecord.content}
              rect={activeCell.rect}
              multiline
              onSave={(v) => onUpdateField(activeRecord.id, "content", v)}
              onClose={() => setActiveCell(null)}
            />
          )}
          {activeCell && activeRecord && TABLE_COLUMN_DEFS[activeCell.field]?.editable === "datetime" && (
            <DateTimeCellPopover
              initialDate={activeRecord[TABLE_COLUMN_DEFS[activeCell.field].dateField]}
              initialTime={activeRecord[TABLE_COLUMN_DEFS[activeCell.field].timeField]}
              initialEndDate={TABLE_COLUMN_DEFS[activeCell.field].endDateField ? activeRecord[TABLE_COLUMN_DEFS[activeCell.field].endDateField] : ""}
              hasEndDateField={!!TABLE_COLUMN_DEFS[activeCell.field].endDateField}
              rect={activeCell.rect}
              onSave={(d, t, ed) => onUpdateDateTime(
                activeRecord.id,
                TABLE_COLUMN_DEFS[activeCell.field].dateField,
                d,
                TABLE_COLUMN_DEFS[activeCell.field].timeField,
                t,
                TABLE_COLUMN_DEFS[activeCell.field].endDateField,
                ed
              )}
              onClose={() => setActiveCell(null)}
            />
          )}
          {activeCell && activeRecord && activeCell.field === "customer" && (
            <SelectCellPopover
              value={activeRecord.customer}
              rect={activeCell.rect}
              options={customerOptions}
              colorFn={(v) => getColor(v, customerOptions.indexOf(v))}
              onSetColor={onSetOptionColor}
              allowCreate={true}
              onSelect={(v) => onUpdateField(activeRecord.id, "customer", v)}
              onReorder={onReorderCustomerOptions}
              onRemoveOption={onRemoveCustomerOption}
              onClose={() => setActiveCell(null)}
            />
          )}
          {activeCell && activeRecord && activeCell.field === "tag" && (
            <SelectCellPopover
              value={activeRecord.tag}
              rect={activeCell.rect}
              options={tags}
              colorFn={(v, i) => getColor(v, i >= 0 ? i : tags.indexOf(v))}
              onSetColor={onSetOptionColor}
              allowCreate={false}
              onSelect={(v) => onUpdateField(activeRecord.id, "tag", v)}
              onReorder={onReorderTags}
              onClose={() => setActiveCell(null)}
            />
          )}
          {activeCell && activeRecord && activeCell.field === "status" && (
            <SelectCellPopover
              value={activeRecord.status}
              rect={activeCell.rect}
              options={getStatusesForKind(activeRecord.kind || "校正")}
              colorFn={(v) => getColor(v, getStatusesForKind(activeRecord.kind || "校正").indexOf(v))}
              onSetColor={onSetOptionColor}
              allowCreate={false}
              onSelect={(v) => onUpdateField(activeRecord.id, "status", v)}
              onClose={() => setActiveCell(null)}
            />
          )}
        </div>
      );
    }

    // ================= Table Column Admin =================
    function TableColumnAdmin({ columnOrder, hiddenColumns, onReorder, onToggleHidden, onClose }) {
      const [dragIdx, setDragIdx] = useState(null);

      return (
        <div style={styles.overlay} onClick={onClose}>
          <div style={styles.modal} onClick={e => e.stopPropagation()}>
            <div style={styles.modalHead}>
              <div style={styles.modalTitle}>列を表示 / 非表示</div>
              <button style={styles.iconBtn} onClick={onClose}><X size={16} /></button>
            </div>
            <div style={styles.statusAdminHint}>ドラッグして並び替え、目のアイコンで表示/非表示を切替</div>
            <div style={styles.tagAdminList}>
              {columnOrder.map((key, idx) => {
                const def = TABLE_COLUMN_DEFS[key];
                if (!def) return null;
                const isHidden = hiddenColumns.includes(key);
                return (
                  <div
                    key={key}
                    style={{
                      ...styles.statusAdminRow,
                      ...(dragIdx === idx ? styles.statusAdminRowDragging : {}),
                      ...(isHidden ? styles.statusAdminRowHidden : {}),
                    }}
                    draggable
                    onDragStart={() => setDragIdx(idx)}
                    onDragOver={(e) => e.preventDefault()}
                    onDrop={() => { if (dragIdx !== null && dragIdx !== idx) onReorder(dragIdx, idx); setDragIdx(null); }}
                    onDragEnd={() => setDragIdx(null)}
                  >
                    <GripVertical size={14} color="var(--clr6b6658)" />
                    <span style={styles.statusAdminName}>{def.label}</span>
                    <button
                      style={styles.iconBtn}
                      onClick={() => onToggleHidden(key)}
                      title={isHidden ? "表示する" : "非表示にする"}
                    >
                      {isHidden ? <EyeOff size={14} /> : <Eye size={14} />}
                    </button>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // ================= Mobile Phone View (スマホ: 追加・確認中心) =================
    // ================= Quick Add Form (クイック登録: 運転中・作業中でもサッと打てる最小構成) =================
    // 拠点名(件名)・得意先・種別・内容の4項目だけに絞った軽量な新規登録フォーム。
    // それ以外の項目(日程・型式・担当者など)は空のまま保存し、後で通常の編集画面から追記する想定。
    function QuickAddForm({ customerOptions, kinds, getColor, onSave, onCancel, onReorderCustomerOptions, onReorderKinds, onSetOptionColor, onRemoveCustomerOption }) {
      const [subject, setSubject] = useState("");
      const [customer, setCustomer] = useState("");
      const [kind, setKind] = useState("");
      const [content, setContent] = useState("");
      const inputRef = useRef(null);
      useEffect(() => { inputRef.current?.focus(); }, []);

      const submit = () => {
        if (!subject.trim()) { alert("拠点名（件名）を入力してください"); return; }
        if (!kind) { alert("種別を選択してください"); return; }
        onSave({ subject: subject.trim(), customer, kind, content: content.trim() });
      };

      return (
        <div style={styles.overlay} onClick={onCancel}>
          <div style={{ ...styles.modal, maxWidth: 420 }} onClick={e => e.stopPropagation()}>
            <div style={styles.modalHead}>
              <div style={styles.modalTitle}>クイック登録</div>

                  style={styles.input}

              <div>

                  value={kind}

                <NotionPropertySelect
                  value={customer}
                  options={customerOptions}
                  colorFn={(v) => getColor(v, customerOptions.indexOf(v))}
                  onSetColor={onSetOptionColor}
                  allowCreate={true}

      );
    }

    // ================= Calendar View =================
    function CalendarView({ records, codes, tags, cursor, setCursor, axis, setAxis, onEdit, getColor, compact }) {
      const { y, m } = cursor;
      const cells = useMemo(() => monthMatrix(y, m), [y, m]);
      const [selectedIso, setSelectedIso] = useState(null);
      const byDate = useMemo(() => {
        const map = {};
        const pushItem = (iso, r, phase) => {
          if (!iso) return;
          (map[iso] = map[iso] || []).push({ r, phase });
        };
        if (axis === "all") {
          for (const r of records) {
            pushItem(r.precheckDate || r.visitDate, r, "precheck");
            pushItem(r.honkouseiDate || r.workDate, r, "honkousei");
          }
        } else {
          for (const r of records) {
            const iso = axis === "precheck" ? (r.precheckDate || r.visitDate) : (r.honkouseiDate || r.workDate);
            pushItem(iso, r, axis);
          }
        }
        const timeFor = (r, phase) => (phase === "precheck" ? (r.precheckTime || r.visitTime) : (r.honkouseiTime || r.workTime)) || "";
        for (const iso in map) {
          map[iso].sort((a, b) => timeFor(a.r, a.phase).localeCompare(timeFor(b.r, b.phase)));
        }
        return map;
      }, [records, axis]);

      const move = (delta) => {
        let nm = m + delta, ny = y;
        if (nm < 0) { nm = 11; ny -= 1; }
        if (nm > 11) { nm = 0; ny += 1; }
        setCursor({ y: ny, m: nm });
        setSelectedIso(null);
      };

      const todayIso = toISODate(new Date());

      return (
        <div>
          <div style={styles.calHeader}>
            <div style={styles.calNav}>
              <button style={styles.iconBtn} onClick={() => move(-1)}><ChevronLeft size={16} /></button>
              <div style={styles.calMonthLabel}>{y}年 {m + 1}月</div>
              <button style={styles.iconBtn} onClick={() => move(1)}><ChevronRight size={16} /></button>
            </div>
            <div style={styles.viewToggle}>
              <button
                style={{ ...styles.viewBtn, ...(axis === "precheck" ? styles.viewBtnActive : {}) }}
                onClick={() => setAxis("precheck")}
              >第1日程 (事前点検/訪問)</button>
              <button
                style={{ ...styles.viewBtn, ...(axis === "honkousei" ? styles.viewBtnActive : {}) }}
                onClick={() => setAxis("honkousei")}
              >第2日程 (本校正/作業)</button>
              <button
                style={{ ...styles.viewBtn, ...(axis === "all" ? styles.viewBtnActive : {}) }}
                onClick={() => setAxis("all")}
              >すべて</button>
            </div>
          </div>
          {axis === "all" && (
            <div style={{ fontSize: 11, color: "var(--clr8f8a7c)", marginBottom: 10 }}>
              ① 第1日程(事前点検/訪問)　② 第2日程(本校正/作業)
            </div>
          )}

          <div style={compact ? styles.calGridCompact : styles.calGrid}>
            {["日", "月", "火", "水", "木", "金", "土"].map(d => (
              <div key={d} style={compact ? styles.calDowCompact : styles.calDow}>{d}</div>
            ))}
            {cells.map((date, i) => {
              const iso = date ? toISODate(date) : null;
              const items = iso ? (byDate[iso] || []) : [];
              const isToday = iso === todayIso;
              const isSelected = compact && iso === selectedIso;

              if (compact) {
                return (
                  <div
                    key={i}
                    style={{
                      ...styles.calCellCompact,
                      ...(date ? {} : styles.calCellEmpty),
                      ...(isSelected ? styles.calCellCompactSelected : {}),
                    }}
                    onClick={() => date && setSelectedIso(iso === selectedIso ? null : iso)}
                  >
                    {date && (
                      <>
                        <div style={{ ...styles.calDateNumCompact, ...(isToday ? styles.calDateNumToday : {}) }}>
                          {date.getDate()}
                        </div>
                        {items.length > 0 && (
                          <div style={styles.calDotsRow}>
                            {items.slice(0, 4).map(({ r, phase }) => (
                              <span
                                key={r.id + ":" + phase}
                                style={{ ...styles.calDot, background: r.tag ? getColor(r.tag, tags.indexOf(r.tag)) : "var(--clr5a5548)" }}
                              />
                            ))}
                          </div>
                        )}
                      </>
                    )}
                  </div>
                );
              }

              return (
                <div key={i} style={{ ...styles.calCell, ...(date ? {} : styles.calCellEmpty) }}>
                  {date && (
                    <>
                      <div style={{ ...styles.calDateNum, ...(isToday ? styles.calDateNumToday : {}) }}>
                        {date.getDate()}
                      </div>
                      <div style={styles.calItems}>
                        {items.map(({ r, phase }) => {
                          const t = phase === "precheck" ? (r.precheckTime || r.visitTime) : (r.honkouseiTime || r.workTime);
                          const endD = phase === "precheck" ? (r.precheckDate ? r.precheckEndDate : r.visitEndDate) : (r.honkouseiDate ? r.honkouseiEndDate : r.workEndDate);
                          const startD = phase === "precheck" ? (r.precheckDate || r.visitDate) : (r.honkouseiDate || r.workDate);
                          return (
                            <div
                              key={r.id + ":" + phase}
                              style={{ ...styles.calItem, borderLeftColor: r.tag ? getColor(r.tag, tags.indexOf(r.tag)) : "var(--clr5a5548)" }}
                              onClick={() => onEdit(r)}
                              title={r.subject}
                            >
                              {axis === "all" && (
                                <span style={{ fontSize: 9.5, fontWeight: 700, color: phase === "precheck" ? "var(--clr8fb3d9)" : "var(--clrc68a3d)", marginRight: 3 }}>
                                  {phase === "precheck" ? "①" : "②"}
                                </span>
                              )}
                              {t && <span style={styles.calItemTime}>{t} </span>}
                              {r.subject || "（無題）"}
                              {endD && endD !== startD && (
                                <span style={{ ...styles.calItemTime, marginLeft: 3 }}>〜{Number(endD.slice(5, 7))}/{Number(endD.slice(8, 10))}</span>
                              )}
                              {r.tag && (
                                <span style={{
                                  marginLeft: 4, fontSize: 9, padding: "0 4px", borderRadius: 3,
                                  background: getColor(r.tag, tags.indexOf(r.tag)), color: "var(--clrf4efe3)",
                                  whiteSpace: "nowrap", fontWeight: 600,
                                }}>
                                  {r.tag}
                                </span>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    </>
                  )}
                </div>
              );
            })}
          </div>

          {compact && selectedIso && (
            <div style={styles.calAgenda}>
              <div style={styles.calAgendaTitle}>
                {selectedIso.slice(5, 7)}月{Number(selectedIso.slice(8, 10))}日の予定
              </div>
              {(byDate[selectedIso] || []).length === 0 ? (
                <div style={{ fontSize: 12, color: "var(--clr8f8a7c)" }}>予定はありません</div>
              ) : (
                <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                  {(byDate[selectedIso] || []).map(({ r, phase }) => {
                    const t = phase === "precheck" ? (r.precheckTime || r.visitTime) : (r.honkouseiTime || r.workTime);
                    const endD = phase === "precheck" ? (r.precheckDate ? r.precheckEndDate : r.visitEndDate) : (r.honkouseiDate ? r.honkouseiEndDate : r.workEndDate);
                    const startD = phase === "precheck" ? (r.precheckDate || r.visitDate) : (r.honkouseiDate || r.workDate);
                    return (
                      <div
                        key={r.id + ":" + phase}
                        style={{ ...styles.calAgendaItem, borderLeftColor: r.tag ? getColor(r.tag, tags.indexOf(r.tag)) : "var(--clr5a5548)" }}
                        onClick={() => onEdit(r)}
                      >
                        <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                          {axis === "all" && (
                            <span style={{ fontSize: 10.5, fontWeight: 700, color: phase === "precheck" ? "var(--clr8fb3d9)" : "var(--clrc68a3d)" }}>
                              {phase === "precheck" ? "①" : "②"}
                            </span>
                          )}
                          {t && <span style={styles.calItemTime}>{t}</span>}
                          <span style={{ fontSize: 13, fontWeight: 600, color: "var(--clre9e4d8)" }}>{r.subject || "（無題）"}</span>
                          {endD && endD !== startD && (
                            <span style={styles.calItemTime}>〜{Number(endD.slice(5, 7))}/{Number(endD.slice(8, 10))}</span>
                          )}
                          {r.tag && (
                            <span style={{
                              fontSize: 10, padding: "1px 6px", borderRadius: 4,
                              background: getColor(r.tag, tags.indexOf(r.tag)), color: "var(--clrf4efe3)", fontWeight: 600,
                            }}>
                              {r.tag}
                            </span>
                          )}
                        </div>
                        {r.customer && <div style={{ fontSize: 11.5, color: "var(--clr8f8a7c)", marginTop: 2 }}>{r.customer}</div>}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ================= Board View =================

      if (top + 340 > window.innerHeight) {
        top = Math.max(margin, window.innerHeight - 350);

            left, top, width,

    function BoardView({ records, codes, tags, statuses, statusVisibility, layout, onEdit, onDelete, onOpenEquip, onMoveStatus, onReorderStatuses, onExpandStatus, getColor }) {
      const [dragCardId, setDragCardId] = useState(null);
      const [dragStatus, setDragStatus] = useState(null);
      const [overStatus, setOverStatus] = useState(null);
      const [hoveredData, setHoveredData] = useState(null);

      const visLevel = (s) => statusVisibility[s] || "visible";
      const fullStatuses = useMemo(
        () => statuses.filter(s => visLevel(s) === "visible"),
        [statuses, statusVisibility]
      );
      const collapsedStatuses = useMemo(
        () => statuses.filter(s => visLevel(s) === "collapsed"),
        [statuses, statusVisibility]
      );

      const byStatus = useMemo(() => {
        const map = {};
        for (const s of statuses) map[s] = [];
        const unassigned = [];
        for (const r of records) {
          if (r.status && map[r.status]) map[r.status].push(r);
          else unassigned.push(r);
        }
        return { map, unassigned };
      }, [records, statuses]);

      const onCardDragStart = (e, recordId) => {
        setHoveredData(null);
        setDragCardId(recordId);
        e.dataTransfer.setData("text/plain", recordId);
        e.dataTransfer.effectAllowed = "move";
      };
      const onColumnDrop = (e, status) => {
        e.preventDefault();
        if (dragCardId) {
          onMoveStatus(dragCardId, status);
          setDragCardId(null);
        }
      };

      const onColHeaderDrop = (targetStatus) => {
        if (dragStatus !== null && dragStatus !== targetStatus) {
          onReorderStatuses(statuses.indexOf(dragStatus), statuses.indexOf(targetStatus));
        }
        setDragStatus(null);
        setOverStatus(null);
      };

      const handleMouseEnter = (e, record) => {
        if (dragCardId) return;
        const rect = e.currentTarget.getBoundingClientRect();
        setHoveredData({ record, rect });
      };

      const handleMouseLeave = () => {
        setHoveredData(null);
      };

      const scrollStyle = layout === "grid"
        ? { ...styles.boardScroll, flexWrap: "wrap", overflowX: "visible" }
        : styles.boardScroll;

      return (
        <div style={styles.boardOuterRow} onMouseLeave={handleMouseLeave}>
          <div style={styles.boardWrap}>
            <div style={scrollStyle}>
              {fullStatuses.map((status) => (
                <div
                  key={status}
                  style={{ ...styles.boardCol, ...(overStatus === status ? styles.boardColDragOver : {}) }}
                  onDragOver={(e) => { e.preventDefault(); if (dragStatus !== null) setOverStatus(status); }}
                  onDragLeave={() => setOverStatus(o => (o === status ? null : o))}
                  onDrop={(e) => { if (dragStatus !== null) onColHeaderDrop(status); else onColumnDrop(e, status); setOverStatus(null); }}
                >
                  <div
                    style={{
                      ...styles.boardColHead,
                      background: getColor(status, statuses.indexOf(status)),
                      borderBottom: "none",
                      borderTopLeftRadius: 9, borderTopRightRadius: 9,
                    }}
                    draggable
                    onDragStart={() => setDragStatus(status)}
                    onDragEnd={() => { setDragStatus(null); setOverStatus(null); }}
                    title="ドラッグして列を並び替え"
                  >
                    <GripVertical size={13} color={readableTextOn(getColor(status, statuses.indexOf(status)))} />
                    <span style={{ ...styles.boardColTitle, color: readableTextOn(getColor(status, statuses.indexOf(status))) }}>
                      {status}
                    </span>
                    <span style={{ ...styles.boardColCount, background: "rgba(0,0,0,0.18)", color: readableTextOn(getColor(status, statuses.indexOf(status))) }}>{byStatus.map[status]?.length || 0}</span>
                  </div>
                  <div style={styles.boardColBody}>
                    {(byStatus.map[status] || []).map(r => (
                      <div key={r.id} className="board-card-container">
                        <div
                          style={{ ...styles.boardCard, ...(dragCardId === r.id ? styles.boardCardDragging : {}) }}
                          draggable
                          onDragStart={(e) => onCardDragStart(e, r.id)}
                          onDragEnd={() => setDragCardId(null)}
                          onMouseEnter={(e) => handleMouseEnter(e, r)}
                          onClick={() => onEdit(r)}
                        >
                          <div style={styles.boardCardTitle}>{r.subject || "（無題）"}</div>
                          {r.kind && <span style={{ ...styles.pill, background: getColor(r.kind, 0), fontSize: 10, padding: "1px 5px", marginBottom: 4 }}>{r.kind}</span>}
                          {r.content ? (
                            <div style={styles.boardCardContent}>{r.content}</div>
                          ) : (
                            <div style={{ fontSize: 11, color: "var(--clr605a49)" }}>内容未記入</div>
                          )}
                        </div>

                        {hoveredData && hoveredData.record.id === r.id && (
                          <BoardCardFloatingDetail
                            record={hoveredData.record}
                            anchorRect={hoveredData.rect}
                            onEdit={onEdit}
                            onDelete={onDelete}
                            onOpenEquip={onOpenEquip}
                            onClose={() => setHoveredData(null)}
                          />
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>

            {byStatus.unassigned.length > 0 && (
              <div style={styles.boardUnassigned}>
                <div style={styles.boardColTitle}>ステータス未設定 ({byStatus.unassigned.length}件)</div>
                <div style={styles.boardUnassignedList}>
                  {byStatus.unassigned.map(r => (
                    <div key={r.id} style={styles.boardCard} onClick={() => onEdit(r)} onMouseEnter={(e) => handleMouseEnter(e, r)}>
                      <div style={styles.boardCardTitle}>{r.subject || "（無題）"}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>

          {collapsedStatuses.length > 0 && (
            <div style={styles.boardCollapsedPanel}>
              <div style={styles.boardCollapsedTitle}>簡易表示中</div>
              {collapsedStatuses.map((status) => (
                <div
                  key={status}
                  style={styles.boardCollapsedRow}
                  onClick={() => onExpandStatus(status)}
                  title="クリックで通常表示に戻す"
                >
                  <span style={{ ...styles.boardCollapsedDot, background: getColor(status, statuses.indexOf(status)) }} />
                  <span style={styles.boardCollapsedName}>{status}</span>
                  <span style={styles.boardColCount}>{byStatus.map[status]?.length || 0}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ================= Status Admin =================
    function StatusAdmin({ statusesKousei, statusesShuuri, hiddenStatuses, onAdd, onRename, onRemove, onReorder, onToggleHidden, onClose }) {
      const [activeTab, setActiveTab] = useState("校正");
      const [newStatus, setNewStatus] = useState("");
      const [editingIdx, setEditingIdx] = useState(null);
      const [editingText, setEditingText] = useState("");
      const [dragIdx, setDragIdx] = useState(null);

      const currentStatuses = activeTab === "校正" ? statusesKousei : statusesShuuri;

      const startEdit = (idx) => { setEditingIdx(idx); setEditingText(currentStatuses[idx]); };
      const commitEdit = () => {
        if (editingIdx !== null) onRename(activeTab, currentStatuses[editingIdx], editingText);
        setEditingIdx(null);
      };

      const VIS_OPTIONS = [
        { level: "visible", icon: Eye, label: "表示" },
        { level: "collapsed", icon: Minus, label: "簡易" },
        { level: "hidden", icon: EyeOff, label: "非表示" },
      ];

      return (
        <div style={styles.overlay} onClick={onClose}>
          <div style={styles.modal} onClick={e => e.stopPropagation()}>
            <div style={styles.modalHead}>
              <div style={styles.modalTitle}>ステータス列を編集</div>
              <button style={styles.iconBtn} onClick={onClose}><X size={16} /></button>
            </div>

            <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
              <button
                style={{ ...styles.viewBtn, ...(activeTab === "校正" ? styles.viewBtnActive : {}) }}
                onClick={() => { setActiveTab("校正"); setEditingIdx(null); }}
              >校正ルート</button>
              <button
                style={{ ...styles.viewBtn, ...(activeTab === "修理・不具合対応" ? styles.viewBtnActive : {}) }}
                onClick={() => { setActiveTab("修理・不具合対応"); setEditingIdx(null); }}
              >修理ルート</button>
            </div>

            <div style={styles.statusAdminHint}>ドラッグして並び替え、クリックで名前を編集</div>
            <div style={styles.tagAdminList}>
              {currentStatuses.map((s, idx) => {
                const level = hiddenStatuses[s] || "visible";
                return (
                  <div
                    key={s}
                    style={{
                      ...styles.statusAdminRow,
                      ...(dragIdx === idx ? styles.statusAdminRowDragging : {}),
                      ...(level !== "visible" ? styles.statusAdminRowHidden : {}),
                    }}
                    draggable
                    onDragStart={() => setDragIdx(idx)}
                    onDragOver={(e) => e.preventDefault()}
                    onDrop={() => { if (dragIdx !== null && dragIdx !== idx) onReorder(activeTab, dragIdx, idx); setDragIdx(null); }}
                    onDragEnd={() => setDragIdx(null)}
                  >
                    <GripVertical size={14} color="var(--clr6b6658)" />
                    {editingIdx === idx ? (
                      <input
                        style={{ ...styles.input, flex: 1 }}
                        value={editingText}
                        autoFocus
                        onChange={e => setEditingText(e.target.value)}
                        onBlur={commitEdit}
                        onKeyDown={e => { if (e.key === "Enter") commitEdit(); if (e.key === "Escape") setEditingIdx(null); }}
                      />
                    ) : (
                      <span style={styles.statusAdminName} onClick={() => startEdit(idx)}>{s}</span>
                    )}
                    <div style={styles.statusVisGroup}>
                      {VIS_OPTIONS.map(opt => (
                        <button
                          key={opt.level}
                          style={{ ...styles.statusVisBtn, ...(level === opt.level ? styles.statusVisBtnActive : {}) }}
                          onClick={() => onToggleHidden(s, opt.level)}
                          title={opt.label}
                        >
                          <opt.icon size={13} />
                        </button>
                      ))}
                    </div>
                    <button style={styles.iconBtn} onClick={() => onRemove(activeTab, s)}><Trash2 size={14} /></button>
                  </div>
                );
              })}
            </div>
            <div style={styles.fieldRow}>
              <input
                style={styles.input}
                placeholder="新しいステータス名"
                value={newStatus}
                onChange={e => setNewStatus(e.target.value)}
                onKeyDown={e => { if (e.key === "Enter" && newStatus.trim()) { onAdd(activeTab, newStatus); setNewStatus(""); } }}
              />
              <button style={styles.primaryBtn} onClick={() => { if (newStatus.trim()) { onAdd(activeTab, newStatus); setNewStatus(""); } }}>
                <Plus size={15} /> 追加
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ================= Compact Notion-Style Record Form with Smart Date Visibility =================
    function RecordForm({ initial, codes, dealerGroups, kinds, tags, getStatusesForKind, customerOptions, contactOptions, chargeOptions, modelOptions, onCancel, onSave, onDelete, onOpenEquip, getColor, onSetOptionColor, onReorderCustomerOptions, onReorderContactOptions, onReorderChargeOptions, onReorderModelOptions, onReorderTags, onReorderKinds, onReorderStatuses, onUploadAttachment, onSaveAttachments, onUpdateField, onRemoveCustomerOption, onRemoveContactOption, onRemoveChargeOption, onRemoveModelOption }) {
      const [subject, setSubject] = useState(initial?.subject || "");
      const [kind, setKind] = useState(initial?.kind || "");
      const [code, setCode] = useState(initial?.code || "");
      const [customer, setCustomer] = useState(initial?.customer || "");
      const [contactName, setContactName] = useState(initial?.contactName || "");
      const [personInCharge, setPersonInCharge] = useState(initial?.personInCharge || "");
      const [model, setModel] = useState(initial?.model || "");
      const [serialYear, setSerialYear] = useState(initial?.serialYear || "");
      const [content, setContent] = useState(initial?.content || "");
      const [status, setStatus] = useState(initial?.status || getStatusesForKind(initial?.kind || "校正")[0] || "");
      const [tag, setTag] = useState(initial?.tag || "");
      const [note, setNote] = useState(initial?.note || "");
      const [attachments, setAttachments] = useState(initial?.attachments || []);
      const [uploadingCount, setUploadingCount] = useState(0);
      const attachInputRef = useRef(null);
      const estimateInputRef = useRef(null);
      const [uploadingEstimate, setUploadingEstimate] = useState(false);

      const estimateAttachments = attachments.filter(a => a.category === "estimate");
      const otherAttachments = attachments.filter(a => a.category !== "estimate");

      const handleFilesSelected = async (fileList, category) => {
        if (!initial?.id) {
          alert("添付ファイルは、一度保存してから追加できます。先に「保存」を押してください。");
          return;
        }
        const files = Array.from(fileList || []);
        if (files.length === 0) return;
        const isEstimate = category === "estimate";
        if (isEstimate) setUploadingEstimate(true); else setUploadingCount(files.length);
        let current = attachments;
        for (const file of files) {
          try {
            const added = await onUploadAttachment(initial.id, current, file);
            if (added) {
              const tagged = { ...added, category: category || undefined };
              current = [...current, tagged];
              onSaveAttachments(initial.id, current);
            }
            setAttachments(current);
          } catch (e) {
            console.error(e);
            alert(`「${file.name}」のアップロードに失敗しました: ${e.message}`);
          } finally {
            if (!isEstimate) setUploadingCount(n => Math.max(0, n - 1));
          }
        }
        if (isEstimate) {
          setUploadingEstimate(false);
          // 見積書が添付されたら、可能であればステータスを「見積提出」まで自動で進める(後退はさせない、終了系ステータスには触れない)
          const targetStatus = "見積提出";
          if (availableStatuses.includes(targetStatus) && !AUTO_STATUS_TERMINAL.includes(status)) {
            const curIdx = availableStatuses.indexOf(status);
            const targetIdx = availableStatuses.indexOf(targetStatus);
            if (targetIdx > curIdx) {
              setStatus(targetStatus);
              onUpdateField(initial.id, "status", targetStatus);
            }
          }
        }
      };

      const removeAttachment = (id) => {
        if (!window.confirm("この添付ファイルを台帳から削除しますか？(Googleドライブ上のファイル自体は残ります)")) return;
        const next = attachments.filter(a => a.id !== id);
        setAttachments(next);
        onSaveAttachments(initial.id, next);
      };


      const [receivedDate, setReceivedDate] = useState(toISODate(initial?.receivedDate) || (!initial ? toISODate(new Date()) : ""));
      const [receivedTime, setReceivedTime] = useState(initial?.receivedTime || "");
      const [visitDate, setVisitDate] = useState(toISODate(initial?.visitDate) || "");
      const [visitTime, setVisitTime] = useState(initial?.visitTime || "");
      const [visitEndDate, setVisitEndDate] = useState(toISODate(initial?.visitEndDate) || "");
      const [workDate, setWorkDate] = useState(toISODate(initial?.workDate) || "");
      const [workTime, setWorkTime] = useState(initial?.workTime || "");
      const [workEndDate, setWorkEndDate] = useState(toISODate(initial?.workEndDate) || "");
      const [precheckDate, setPrecheckDate] = useState(toISODate(initial?.precheckDate) || "");
      const [precheckTime, setPrecheckTime] = useState(initial?.precheckTime || "");
      const [precheckEndDate, setPrecheckEndDate] = useState(toISODate(initial?.precheckEndDate) || "");
      const [honkouseiDate, setHonkouseiDate] = useState(toISODate(initial?.honkouseiDate) || "");
      const [honkouseiTime, setHonkouseiTime] = useState(initial?.honkouseiTime || "");
      const [honkouseiEndDate, setHonkouseiEndDate] = useState(toISODate(initial?.honkouseiEndDate) || "");

      const [codeQuery, setCodeQuery] = useState("");
      const [showSuggest, setShowSuggest] = useState(false);
      const [codeCopied, setCodeCopied] = useState(false);
      const handleCopyCodeInForm = (val) => {
        copyToClipboard(val);
        setCodeCopied(true);
        setTimeout(() => setCodeCopied(false), 1200);
      };

      const availableStatuses = useMemo(() => getStatusesForKind(kind), [kind, getStatusesForKind]);

      const handleKindChange = (nextKind) => {
        setKind(nextKind);
        const nextStatuses = getStatusesForKind(nextKind);
        if (!nextStatuses.includes(status)) {
          setStatus(nextStatuses[0] || "");
        }
      };

      const matches = useMemo(() => {
        if (!codeQuery.trim()) return [];
        const q = codeQuery.trim().toLowerCase();
        return codes
          .filter(c => {
            const dealer = dealerFor(c.code, dealerGroups);
            return (
              c.name.toLowerCase().includes(q) ||
              c.code.toLowerCase().includes(q) ||
              (dealer && (
                dealer.abbr.toLowerCase().includes(q) ||
                dealer.name.includes(q) ||
                (dealer.customerName && dealer.customerName.includes(q))
              ))
            );
          })
          .slice(0, 8);
      }, [codeQuery, codes, dealerGroups]);

      const pickCode = (c) => {
        setSubject(displayNameFor(c.name, c.code, dealerGroups));
        setCode(c.code);
        
        const dealer = dealerFor(c.code, dealerGroups);
        if (dealer && dealer.customerName) {
          setCustomer(dealer.customerName);
        }

        if (c.code) {
          copyToClipboard(c.code);
        }

        setCodeQuery("");
        setShowSuggest(false);
      };

      const buildRecordPayload = () => ({
        id: initial?.id,
        subject: subject.trim(),
        kind,
        code,
        customer,
        contactName,
        personInCharge,
        model,
        serialYear,
        content,
        status,
        tag,
        note,
        receivedDate: toISODate(receivedDate),
        receivedTime,
        visitDate: toISODate(visitDate),
        visitTime,
        visitEndDate: toISODate(visitEndDate),
        workDate: toISODate(workDate),
        workTime,
        workEndDate: toISODate(workEndDate),
        precheckDate: toISODate(precheckDate),
        precheckTime,
        precheckEndDate: toISODate(precheckEndDate),
        honkouseiDate: toISODate(honkouseiDate),
        honkouseiTime,
        honkouseiEndDate: toISODate(honkouseiEndDate),
        equipmentSheets: initial?.equipmentSheets || [],
        attachments,
      });

      const submit = () => {
        if (!subject.trim()) {
          alert("件名（拠点名）を入力してください");
          return;
        }
        if (!kind) {
          alert("種別を選択してください");
          return;
        }
        onSave(buildRecordPayload());
      };

      const handleOpenEquipFromForm = () => {
        if (!subject.trim()) {
          alert("機器点検票を開く前に、件名（拠点名）を入力してください");
          return;
        }
        if (!kind) {
          alert("機器点検票を開く前に、種別を選択してください");
          return;
        }
        onSave(buildRecordPayload(), true);
      };

      return (
        <div style={styles.overlay} onClick={onCancel}>
          <div
            style={styles.notionModal}
            onClick={e => e.stopPropagation()}
            onKeyDown={e => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); submit(); } }}
          >
            <div style={{ position: "relative", marginBottom: 16 }}>
              <input
                style={styles.notionTitleInput}
                value={subject}
                placeholder="件名・拠点名を入力 または 顧客検索..."
                onChange={e => { setSubject(e.target.value); setCodeQuery(e.target.value); setShowSuggest(true); setCode(""); }}
                onFocus={() => setShowSuggest(true)}
              />
              {code && (
                <span
                  style={{ ...styles.notionCodeBadge, cursor: "pointer", color: codeCopied ? "#2f8f5b" : undefined }}
                  onClick={() => handleCopyCodeInForm(code)}
                  title="クリックでコードをコピー"
                >
                  {codeCopied ? "✓ コピーしました" : `コード: ${code}`}
                </span>
              )}
              {showSuggest && matches.length > 0 && (
                <div style={styles.suggestBox}>
                  {matches.map(c => {
                    const dealer = dealerFor(c.code, dealerGroups);
                    return (
                      <div key={c.id} style={styles.suggestRow} onClick={() => pickCode(c)}>
                        <span>
                          {dealer && <span style={styles.suggestAbbr}>{dealer.abbr}</span>}
                          {c.name}
                          {dealer && <span style={styles.suggestDealer}> ・{dealer.name} ({dealer.customerName})</span>}
                        </span>
                        <span style={styles.suggestCode}>{c.code}</span>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>

            <div style={styles.propList}>
              <div className="prop-row">
                <div className="prop-label"><CalendarIcon size={14} /> 受付日時</div>
                <div className="prop-value">
                  <DateTimePicker dateValue={receivedDate} timeValue={receivedTime} onDateChange={setReceivedDate} onTimeChange={setReceivedTime} />
                </div>
              </div>

              <div className="prop-row">
                <div className="prop-label"><Layers size={14} /> 種別</div>
                <div className="prop-value">
                  <NotionPropertySelect
                    value={kind}
                    options={kinds.map(k => k.name)}
                    colorFn={(v) => getColor(v, 0)}
                    onSetColor={onSetOptionColor}
                    allowCreate={false}
                    onSelect={handleKindChange}
                    onReorder={onReorderKinds}
                  />
                </div>
              </div>

              <div className="prop-row">
                <div className="prop-label"><Tag size={14} /> NSS</div>
                <div className="prop-value">
                  <NotionPropertySelect
                    value={tag}
                    options={tags}
                    colorFn={(v, i) => getColor(v, i >= 0 ? i : tags.indexOf(v))}
                    onSetColor={onSetOptionColor}
                    allowCreate={false}
                    onSelect={setTag}
                    onReorder={onReorderTags}
                  />
                </div>
              </div>

              <div className="prop-row">
                <div className="prop-label"><User size={14} /> 営業担当</div>
                <div className="prop-value">
                  <NotionPropertySelect
                    value={contactName}
                    options={contactOptions}
                    colorFn={(v) => getColor(v, contactOptions.indexOf(v))}
                    onSetColor={onSetOptionColor}
                    allowCreate={true}
                    onSelect={setContactName}
                    onReorder={onReorderContactOptions}
                    onRemoveOption={onRemoveContactOption}
                  />
                </div>
              </div>

              <div className="prop-row">
                <div className="prop-label"><Building size={14} /> 得意先</div>
                <div className="prop-value">
                  <NotionPropertySelect

    // ================= Date Picker Only =================
    function DatePicker({ value, onChange }) {
      const [open, setOpen] = useState(false);
      const [cursor, setCursor] = useState(() => {
        const base = value ? new Date(value + "T00:00:00") : new Date();
        return { y: base.getFullYear(), m: base.getMonth() };
      });
      const cells = useMemo(() => monthMatrix(cursor.y, cursor.m), [cursor]);

      const move = (delta) => {
        let nm = cursor.m + delta, ny = cursor.y;
        if (nm < 0) { nm = 11; ny -= 1; }
        if (nm > 11) { nm = 0; ny += 1; }
        setCursor({ y: ny, m: nm });
      };

      const pick = (date) => {
        onChange(toISODate(date));
        setOpen(false);
      };

      useEffect(() => {
        if (!open) return;
        const onKey = (e) => { if (e.key === "Escape") { e.stopPropagation(); setOpen(false); } };
        window.addEventListener("keydown", onKey, true);
        return () => window.removeEventListener("keydown", onKey, true);
      }, [open]);

      const todayIso = toISODate(new Date());

      return (
        <div style={{ position: "relative", display: "inline-block" }}>
          <button type="button" style={styles.dtDateBtnNotion} onClick={() => setOpen(o => !o)}>
            <CalendarIcon size={12} /> {value ? fmtJP(value) : "未入力"}
          </button>

          {open && (
            <React.Fragment>
              <div style={styles.dtBackdrop} onClick={() => setOpen(false)} />
              <div style={styles.dtPopup} onClick={e => e.stopPropagation()}>
                <div style={styles.calNav}>
                  <button type="button" style={styles.iconBtn} onClick={() => move(-1)}><ChevronLeft size={14} /></button>
                  <div style={styles.calMonthLabel}>{cursor.y}年 {cursor.m + 1}月</div>
                  <button type="button" style={styles.iconBtn} onClick={() => move(1)}><ChevronRight size={14} /></button>
                </div>
                <div style={styles.dtGrid}>
                  {["日", "月", "火", "水", "木", "金", "土"].map(d => (
                    <div key={d} style={styles.dtDow}>{d}</div>
                  ))}
                  {cells.map((date, i) => {
                    if (!date) return <div key={i} style={styles.dtCellEmpty} />;
                    const iso = toISODate(date);
                    const selected = iso === value;
                    const isToday = iso === todayIso;
                    return (
                      <div
                        key={i}
                        style={{ ...styles.dtCell, ...(isToday ? styles.dtCellToday : {}), ...(selected ? styles.dtCellSelected : {}) }}
                        onClick={() => pick(date)}
                      >
                        {date.getDate()}
                      </div>
                    );
                  })}
                </div>
                <button type="button" style={styles.dtTodayBtn} onClick={() => pick(new Date())}>今日</button>
              </div>
            </React.Fragment>
          )}
        </div>
      );
    }

    // 開始日の隣に添える「終了日」入力(任意)。〇〇日～△△日という期間表示に使う
    function DateTimePicker({ dateValue, timeValue, onDateChange, onTimeChange, endDateValue, onEndDateChange }) {
      const [open, setOpen] = useState(false);
      const [anchorRect, setAnchorRect] = useState(null);
      const [showEndDate, setShowEndDate] = useState(!!endDateValue);
      const [activeField, setActiveField] = useState("start"); // "start" | "end"
      const [cursor, setCursor] = useState(() => {
        const base = dateValue ? new Date(dateValue + "T00:00:00") : new Date();
        return { y: base.getFullYear(), m: base.getMonth() };
      });
      const cells = useMemo(() => monthMatrix(cursor.y, cursor.m), [cursor]);

      const move = (delta) => {
        let nm = cursor.m + delta, ny = cursor.y;
        if (nm < 0) { nm = 11; ny -= 1; }
        if (nm > 11) { nm = 0; ny += 1; }
        setCursor({ y: ny, m: nm });
      };

      const pick = (date) => {
        const iso = toISODate(date);
        if (activeField === "end") {
          onEndDateChange(iso);
        } else {
          onDateChange(iso);
          // 開始日を終了日より後にした場合は、終了日をクリアして不整合を防ぐ
          if (endDateValue && iso > endDateValue) onEndDateChange("");
          if (showEndDate) setActiveField("end");
          else setOpen(false);
        }
      };

      const toggleEndDate = () => {
        if (showEndDate) {
          onEndDateChange("");
          setShowEndDate(false);
          setActiveField("start");
        } else {
          setShowEndDate(true);
          setActiveField("end");
        }
      };

      useEffect(() => {
        if (!open) return;
        const onKey = (e) => {
          if (e.key === "Escape") { e.stopPropagation(); setOpen(false); }
        };
        window.addEventListener("keydown", onKey, true);
        return () => window.removeEventListener("keydown", onKey, true);
      }, [open]);

      const todayIso = toISODate(new Date());
      const hasEndDate = !!endDateValue;

      return (
        <div style={{ position: "relative", display: "flex", gap: 6, alignItems: "center" }}>
          <button
            type="button"
            style={styles.dtDateBtnNotion}
            onClick={(e) => { setAnchorRect(e.currentTarget.getBoundingClientRect()); setActiveField("start"); setOpen(o => !o); }}
          >
            <CalendarIcon size={12} /> {dateValue ? fmtJP(dateValue) : "未入力"}
            {hasEndDate && <span style={{ color: "var(--clr8fb3d9)" }}> 〜 {fmtJP(endDateValue)}</span>}
          </button>
          <input
            type="time"
            style={styles.dtTimeInputNotion}
            value={timeValue || ""}
            onChange={e => onTimeChange(e.target.value)}
          />

          {open && (
            <React.Fragment>
              <div style={styles.dtBackdrop} onClick={() => setOpen(false)} />
              <div style={{ ...styles.dtPopup, ...popoverStyleFor(anchorRect, 230, 380) }} onClick={e => e.stopPropagation()}>
                <div style={styles.calNav}>
                  <button type="button" style={styles.iconBtn} onClick={() => move(-1)}><ChevronLeft size={14} /></button>
                  <div style={styles.calMonthLabel}>{cursor.y}年 {cursor.m + 1}月</div>
                  <button type="button" style={styles.iconBtn} onClick={() => move(1)}><ChevronRight size={14} /></button>
                </div>
                <div style={styles.dtGrid}>
                  {["日", "月", "火", "水", "木", "金", "土"].map(d => (
                    <div key={d} style={styles.dtDow}>{d}</div>
                  ))}
                  {cells.map((date, i) => {
                    if (!date) return <div key={i} style={styles.dtCellEmpty} />;
                    const iso = toISODate(date);
                    const isStart = iso === dateValue;
                    const isEnd = hasEndDate && iso === endDateValue;
                    const inRange = hasEndDate && dateValue && iso > dateValue && iso < endDateValue;
                    const isToday = iso === todayIso;
                    return (
                      <div
                        key={i}
                        style={{
                          ...styles.dtCell,
                          ...(isToday ? styles.dtCellToday : {}),
                          ...(inRange ? styles.dtCellInRange : {}),
                          ...(isStart ? styles.dtCellSelected : {}),
                          ...(isEnd ? styles.dtCellSelectedEnd : {}),
                        }}
                        onClick={() => pick(date)}
                      >
                        {date.getDate()}
                      </div>
                    );
                  })}
                </div>
                <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
                  <button type="button" style={{ ...styles.dtTodayBtn, flex: 1, marginTop: 0 }} onClick={() => pick(new Date())}>今日</button>
                  <button
                    type="button"
                    style={{ ...styles.dtTodayBtn, flex: 1, marginTop: 0, color: "var(--clrc9573f)" }}
                    onClick={() => {
                      onDateChange("");
                      onTimeChange("");
                      if (onEndDateChange) onEndDateChange("");
                      setShowEndDate(false);
                      setOpen(false);
                    }}
                  >クリア</button>
                </div>

                <div style={styles.dtEndDateToggleRow}>
                  <span style={{ fontSize: 12.5, color: "var(--clre9e4d8)" }}>終了日</span>
                  <label style={styles.toggleSwitch}>
                    <input type="checkbox" checked={showEndDate} onChange={toggleEndDate} style={{ display: "none" }} />
                    <span style={{ ...styles.toggleTrack, ...(showEndDate ? styles.toggleTrackOn : {}) }}>
                      <span style={{ ...styles.toggleThumb, ...(showEndDate ? styles.toggleThumbOn : {}) }} />
                    </span>
                  </label>
                </div>

                {showEndDate && (
                  <div style={{ display: "flex", gap: 6, marginTop: 6 }}>
                    <button
                      type="button"
                      style={{ ...styles.dtFieldTab, ...(activeField === "start" ? styles.dtFieldTabActive : {}) }}
                      onClick={() => setActiveField("start")}
                    >
                      開始: {dateValue ? fmtJP(dateValue) : "未入力"}
                    </button>
                    <button
                      type="button"
                      style={{ ...styles.dtFieldTab, ...(activeField === "end" ? styles.dtFieldTabActive : {}) }}
                      onClick={() => setActiveField("end")}
                    >
                      終了: {endDateValue ? fmtJP(endDateValue) : "未入力"}
                    </button>
                  </div>
                )}
              </div>
            </React.Fragment>
          )}
        </div>
      );
    }

    // ================= Import Modal =================
    function ImportModal({ existing, dealerGroups, onClose, onImport }) {
      const [text, setText] = useState("");
      const [fileName, setFileName] = useState("");
      const [dragOver, setDragOver] = useState(false);
      const [error, setError] = useState("");
      const fileInputRef = useRef(null);
      const preview = useMemo(() => parseCsv(text), [text]);

      const readFile = (file) => {
        if (!file) return;
        setError("");
        if (!/\.(csv|tsv|txt)$/i.test(file.name)) {
          setError("CSV / TSV / TXT形式のファイルを選択してください");
          return;
        }
        const reader = new FileReader();
        reader.onload = (e) => {
          const content = String(e.target.result).replace(/^\uFEFF/, "");
          setText(content);
          setFileName(file.name);
        };
        reader.onerror = () => setError("ファイルの読み込みに失敗しました");
        reader.readAsText(file, "UTF-8");
      };

      const onDrop = (e) => {
        e.preventDefault();
        setDragOver(false);
        const file = e.dataTransfer.files?.[0];
        readFile(file);
      };

      return (
        <div style={styles.overlay} onClick={onClose}>
          <div style={styles.modal} onClick={e => e.stopPropagation()}>
            <div style={styles.modalHead}>
              <div style={styles.modalTitle}>顧客コード表を取込</div>
              <button style={styles.iconBtn} onClick={onClose}><X size={16} /></button>
            </div>

            <div
              style={{ ...styles.dropZone, ...(dragOver ? styles.dropZoneActive : {}) }}
              onClick={() => fileInputRef.current?.click()}
              onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
              onDragLeave={() => setDragOver(false)}
              onDrop={onDrop}
            >
              <input
                ref={fileInputRef}
                type="file"
                accept=".csv,.tsv,.txt,text/csv"
                style={{ display: "none" }}
                onChange={(e) => readFile(e.target.files?.[0])}
              />
              <FileText size={22} color="var(--clr9d9788)" />
              <div style={styles.dropZoneText}>
                {fileName ? `${fileName}（追加でもう1ファイル選択できます）` : "CSVファイルをドラッグ&ドロップ、またはクリックして選択"}
              </div>

    function KindAdmin({ kinds, onSave, onClose }) {
      const [rows, setRows] = useState(() => kinds.map(k => ({ ...k })));
      const [error, setError] = useState("");

      const updateRow = (id, field, value) => {
        setRows(prev => prev.map(r => r.id === id ? { ...r, [field]: value } : r));
      };

      const addRow = () => {
        setRows(prev => [...prev, { id: uid(), name: "", dateMode: "single" }]);
      };

      const removeRow = (id) => {
        const target = rows.find(r => r.id === id);
        if (target && target.name === "校正") { setError("「校正」は削除できません"); return; }
        setRows(prev => prev.filter(r => r.id !== id));
      };

      const handleSave = () => {
        const cleaned = rows.map(r => ({ ...r, name: r.name.trim() })).filter(r => r.name);
        if (!cleaned.some(r => r.name === "校正")) {
          setError("「校正」は削除できません");
          return;
        }
        const names = cleaned.map(r => r.name);
        const dup = names.find((n, i) => names.indexOf(n) !== i);
        if (dup) {
          setError(`種別名「${dup}」が重複しています`);
          return;

        setError("");
        onSave(cleaned);
        onClose();
