    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--clr141310); font-family: 'IBM Plex Sans JP', 'Hiragino Sans', sans-serif; }
    input, textarea, button { font-family: inherit; }

       モーダルを閉じても縮小されずに画面が拡大したまま残ることがある。
       スマホ幅ではこれを防ぐため、入力系要素の文字サイズを16px以上に強制する。 */

    .ledger-row { position: relative; transition: background 0.12s ease, box-shadow 0.12s ease; }
    .ledger-row:hover { background: var(--clr211e18); box-shadow: inset 3px 0 0 var(--clrc68a3d); }
    td.ledger-sticky-cell { background: var(--clr141310); }
    .ledger-row:hover td.ledger-sticky-cell { background: var(--clr211e18); box-shadow: inset 3px 0 0 var(--clrc68a3d); }
    .ledger-actions { opacity: 0.55; transition: opacity 0.12s ease; }
    .ledger-row:hover .ledger-actions { opacity: 1; }
    
    .ledger-th { transition: background 0.12s ease; cursor: pointer; user-select: none; }
    .ledger-th:hover { background: var(--clr28241c); color: var(--clrece7dc); }
    .col-resize-handle:hover, .col-resize-handle:active { background: rgba(198,138,61,0.55); }
    .ledger-empty-plus { opacity: 0; transition: opacity 0.12s ease; color: var(--clr8f8879); font-size: 11px; }
    .ledger-cell-editable:hover .ledger-empty-plus { opacity: 0.6; }

    /* Notion Header Menu */
    .notion-menu-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 5px; font-size: 12.5px; color: var(--clrbeb7a6); cursor: pointer; transition: background 0.12s; }
    .notion-menu-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
    .notion-menu-item-danger:hover { background: rgba(201,87,63,0.15); color: var(--clre5735f); }

    /* Notion Properties Table */
    .prop-row { display: flex; align-items: center; min-height: 32px; padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
    .prop-label { width: 140px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--clr8f8879); }
    .prop-value { flex: 1; min-width: 0; display: flex; align-items: center; }
    .prop-input { width: 100%; background: transparent; border: 1px solid transparent; border-radius: 4px; color: var(--clrece7dc); font-size: 13px; padding: 4px 6px; outline: none; transition: all 0.12s; }
    .prop-input:focus { background: var(--clr151310); border-color: var(--clr322d24); }
    .prop-input:hover:not(:focus) { background: rgba(255,255,255,0.03); }
    .prop-select-btn { display: inline-flex; align-items: center; padding: 3px 6px; border-radius: 4px; font-size: 12.5px; cursor: pointer; user-select: none; transition: background 0.12s; }
    .prop-select-btn:hover { background: rgba(255,255,255,0.06); }
    .prop-unselected { color: var(--clr605a49); }

    @media (max-width: 700px) {

      .prop-label { width: 100%; }
      .prop-value { width: 100%; flex-wrap: wrap; }

    const __pendingWrites = new Map(); // key -> { next, timer }
    const __flushWrite = async (key) => {
      const pending = __pendingWrites.get(key);

      if (pending.timer) clearTimeout(pending.timer);

    const STORAGE_DEBOUNCE_MS = 500;

    function useStorageState(key, initial) {
      const [value, setValue] = useState(initial);
      const [loaded, setLoaded] = useState(false);

      useEffect(() => {
        let cancelled = false;
        (async () => {
          try {
            if (window.storage && typeof window.storage.get === "function") {
              const res = await window.storage.get(key, false);
              if (!cancelled && res) setValue(JSON.parse(res.value));
            } else {
              const raw = localStorage.getItem(key);
              if (!cancelled && raw) setValue(JSON.parse(raw));
            }
          } catch (e) {
            // 未保存キーへの初回アクセスは正常な状態(既定値を使用)
          } finally {
            if (!cancelled) setLoaded(true);
          }
        })();
        return () => { cancelled = true; };
      }, [key]);

      // 画面表示は即時反映し、実際のストレージ書き込みは500ms分まとめて実行する
      // (セルを1文字編集するたびに台帳全体をシリアライズ・保存する負荷とAPIレート制限抵触を回避)
      // 画面表示は即時反映し、実際のストレージ書き込みは500ms分まとめて実行する
      // next には値そのものだけでなく React標準の関数形式 (prev => nextValue) も渡せるようにする
      // (これに対応していないと、関数形式で呼び出した箇所でストレージに関数自体を保存しようとして壊れる)
      const persist = useCallback((next) => {
        setValue(prevValue => {
          const resolved = typeof next === "function" ? next(prevValue) : next;
          const existing = __pendingWrites.get(key);
          if (existing && existing.timer) clearTimeout(existing.timer);
          const timer = setTimeout(() => __flushWrite(key), STORAGE_DEBOUNCE_MS);
          __pendingWrites.set(key, { next: resolved, timer });
          return resolved;
        });
      }, [key]);

      return [value, persist, loaded];

    // 時刻欄の無害化: Googleスプレッドシート連携で「時刻のみ」のセルが
    // 1899-12-30T09:30:00.000Z のような日付起点のISO文字列として返ってくることがあるため、
    // どんな形式で来ても "HH:MM" だけを取り出す。抽出できなければ空にする(壊れた文字列を出さない)。
    const toHHMM = (v) => {
      if (!v) return "";
      const s = String(v).trim();
      if (/^\d{1,2}:\d{2}$/.test(s)) {
        const [h, mi] = s.split(":");
        return `${pad(Number(h))}:${mi}`;
      }
      // 末尾にZやタイムゾーンオフセットが付いたISO文字列(例: ...T04:00:00.000Z)はUTCなので、
      // 数字をそのまま抜き出さずDateとして解釈し、ブラウザのローカル時刻(日本時間)に変換する
      if (/T\d{2}:\d{2}/.test(s) && /(Z|[+-]\d{2}:?\d{2})$/.test(s)) {
        const dUtc = new Date(s);
        if (!isNaN(dUtc.getTime())) return `${pad(dUtc.getHours())}:${pad(dUtc.getMinutes())}`;
      }
      // タイムゾーン情報がない日時文字列は、意図しない変換を避けるためそのまま数字だけを取り出す
      const isoMatch = s.match(/T(\d{2}):(\d{2})/);
      if (isoMatch) return `${isoMatch[1]}:${isoMatch[2]}`;
      const d = new Date(s);
      if (!isNaN(d.getTime())) return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
      return "";

    // 背景色の明るさから、その上に乗せる文字色を白/黒どちらにすべきか判定する(色付きタイル上での可読性確保用)
    const readableTextOn = (bgColor) => {
      if (!bgColor || typeof bgColor !== "string" || !bgColor.startsWith("#")) return "#151310";
      let hex = bgColor.slice(1);
      if (hex.length === 3) hex = hex.split("").map(c => c + c).join("");
      if (hex.length !== 6) return "#151310";
      const r = parseInt(hex.slice(0, 2), 16), g = parseInt(hex.slice(2, 4), 16), b = parseInt(hex.slice(4, 6), 16);
      const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      return luminance > 0.55 ? "#151310" : "#f5f2ea";
    };

    // ================= 日程入力に応じたステータス自動更新 =================
    // ①日時(事前点検/訪問)・②日時(本校正/作業)の入力・経過に応じてステータスを自動で前進させる。
    // ・「対応終了分」「やらない」など終了系ステータスには触れない
    // ・ステータスは後退させない(すでに先に進んでいる場合は上書きしない)
    // ・カスタマイズでステータス名が変更/削除されている場合は何もしない(名前が一致しないため)
    const AUTO_STATUS_TERMINAL = ["対応終了分", "やらない"];
    const computeAutoStatus = (record, statusList, kinds) => {
      if (!record || !Array.isArray(statusList) || statusList.length === 0) return record;
      const currentStatus = record.status || "";
      if (AUTO_STATUS_TERMINAL.includes(currentStatus)) return record;
      const currentIdx = statusList.indexOf(currentStatus);
      const todayIso = toISODate(new Date());

      const kindDef = Array.isArray(kinds) ? kinds.find(k => k.name === record.kind) : null;
      const dateMode = kindDef ? kindDef.dateMode : (record.kind === "校正" ? "double" : record.kind === "修理・不具合対応" ? "double" : "single");

      let date1, date2, enteredTarget1, passedTarget1, enteredTarget2, passedTarget2;
      if (record.kind === "校正") {
        date1 = record.precheckDate; date2 = record.honkouseiDate;
        enteredTarget1 = "事前点検日程調整済"; passedTarget1 = "事前点検完了";
        enteredTarget2 = "本校正日程調整済"; passedTarget2 = "本校正完了";
      } else if (dateMode === "double") {
        // 修理・不具合対応、および2段階設定の追加種別はすべて同じ「訪問→作業」型の日程・ステータス名を使う
        date1 = record.visitDate; date2 = record.workDate;
        enteredTarget1 = "訪問日程調整済"; passedTarget1 = "訪問対応済";
        enteredTarget2 = "作業日程調整済"; passedTarget2 = "作業完了";
      } else {
        // 単一日程の種別: 実施予定日時(visitDate)のみ。段階が1つしかないため、日時を過ぎたら「作業完了」まで進める
        date1 = record.visitDate; date2 = null;
        enteredTarget1 = "訪問日程調整済"; passedTarget1 = "作業完了";
        enteredTarget2 = null; passedTarget2 = null;
      }

      let desired = null;
      if (date2 && date2 < todayIso && passedTarget2) desired = passedTarget2;
      else if (date2 && enteredTarget2) desired = enteredTarget2;
      else if (date1 && date1 < todayIso && passedTarget1) desired = passedTarget1;
      else if (date1 && enteredTarget1) desired = enteredTarget1;

      if (!desired) return record;
      const desiredIdx = statusList.indexOf(desired);
      if (desiredIdx === -1 || desiredIdx <= currentIdx) return record;
      return { ...record, status: desired };
    };

    const fmtJP = (val, time) => {
      if (!val) return "—";
      let str = String(val).trim();
      let y, m, d;
      if (/^\d{4}[-\/]\d{1,2}[-\/]\d{1,2}/.test(str)) {
        const parts = str.split(/[-\/]/);
        y = parts[0];
        m = Number(parts[1]);
        d = Number(parts[2].slice(0, 2));
      } else {
        const dateObj = new Date(str);
        if (!isNaN(dateObj.getTime())) {
          y = dateObj.getFullYear();
          m = dateObj.getMonth() + 1;
          d = dateObj.getDate();
        } else {
          return str;
        }
      }
      if (isNaN(m) || isNaN(d)) return str;
      const datePart = `${y}年${m}月${d}日`;
      return time ? `${datePart} ${time}` : datePart;
    };

    // 開始日〜終了日(異なる場合のみ「〇〇日～△△日」表示、同じ/未入力ならfmtJPと同じ)
    const fmtJPRange = (startDate, time, endDate) => {
      if (!startDate) return "—";
      const start = fmtJP(startDate);
      if (!endDate || endDate === startDate) return time ? `${start} ${time}` : start;
      const end = fmtJP(endDate);
      return time ? `${start}〜${end} ${time}` : `${start}〜${end}`;
    };

    const monthMatrix = (year, month) => {
      const first = new Date(year, month, 1);
      const startDay = first.getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const cells = [];
      for (let i = 0; i < startDay; i++) cells.push(null);
      for (let d = 1; d <= daysInMonth; d++) cells.push(new Date(year, month, d));
      while (cells.length % 7 !== 0) cells.push(null);
      return cells;
    };

    const FULL_TO_HALF_KANA = {
      "ガ":"ｶﾞ","ギ":"ｷﾞ","グ":"ｸﾞ","ゲ":"ｹﾞ","ゴ":"ｺﾞ",
      "ザ":"ｻﾞ","ジ":"ｼﾞ","ズ":"ｽﾞ","ゼ":"ｾﾞ","ゾ":"ｿﾞ",
      "ダ":"ﾀﾞ","ヂ":"ﾁﾞ","ヅ":"ﾂﾞ","デ":"ﾃﾞ","ド":"ﾄﾞ",
      "バ":"ﾊﾞ","ビ":"ﾋﾞ","ブ":"ﾌﾞ","ベ":"ﾍﾞ","ボ":"ﾎﾞ",
      "パ":"ﾊﾟ","ピ":"ﾋﾟ","プ":"ﾌﾟ","ペ":"ﾍﾟ","ポ":"ﾎﾟ",
      "ヴ":"ｳﾞ","ア":"ｱ","イ":"ｲ","ウ":"ｳ","エ":"ｴ","オ":"ｵ",
      "カ":"ｶ","キ":"ｷ","ク":"ｸ","ケ":"ｹ","コ":"ｺ",
      "サ":"ｻ","シ":"ｼ","ス":"ｽ","セ":"ｾ","ソ":"ｿ",
      "タ":"ﾀ","チ":"ﾁ","ツ":"ﾂ","テ":"ﾃ","ト":"ﾄ",
      "ナ":"ﾅ","ニ":"ﾆ","ヌ":"ﾇ","ネ":"ﾈ","ノ":"ﾉ",
      "ハ":"ﾊ","ヒ":"ﾋ","フ":"ﾌ","ヘ":"ﾍ","ﾎﾞ":"ﾎ",
      "マ":"ﾏ","ミ":"ﾐ","ム":"ﾑ","メ":"ﾒ","モ":"ﾓ",
      "ヤ":"ﾔ","ユ":"ﾕ","ヨ":"ﾖ","ラ":"ﾗ","リ":"ﾘ",
      "ル":"ﾙ","レ":"ﾚ","ロ":"ﾛ","ワ":"ﾜ","ヲ":"ｦ","ン":"ﾝ",
      "ァ":"ｧ","ィ":"ｨ","ゥ":"ｩ","ェ":"ｪ","ォ":"ｫ",
      "ッ":"ｯ","ャ":"ｬ","ュ":"ｭ","ョ":"ｮ","ー":"ｰ"
    };

    function toHalfWidth(str) {
      if (!str) return str;
      let res = String(str)
        .replace(/[！-～]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
        .replace(/ /g, " ");
      const kanaPattern = new RegExp(Object.keys(FULL_TO_HALF_KANA).join("|"), "g");
      res = res.replace(kanaPattern, match => FULL_TO_HALF_KANA[match]);
      return res;
    }

    // ================= Main App =================
    function App() {
      const [records, setRecords, recLoaded] = useStorageState(REC_KEY, []);
      const [codes, setCodes, codeLoaded] = useStorageState(CODE_KEY, DEFAULT_CODES);
      const [dealerGroups, setDealerGroups, dealerGroupLoaded] = useStorageState(DEALER_GROUP_KEY, DEFAULT_DEALER_GROUPS);
      const [kinds, setKinds, kindsLoaded] = useStorageState(KIND_KEY, DEFAULT_KINDS);
      const [tags, setTags, tagLoaded] = useStorageState(TAG_KEY, DEFAULT_TAGS);
      const [customerOptions, setCustomerOptions, customerOptLoaded] = useStorageState(CUSTOMER_OPT_KEY, ["B藤枝", "UDトラックス", "B掛川", "浜松N", "P静岡"]);

      const [chargeOptions, setChargeOptions, chargeOptLoaded] = useStorageState(CHARGE_OPT_KEY, ["楮原", "海野"]);

      const [customColors, setCustomColors, customColorsLoaded] = useStorageState(CUSTOM_COLORS_KEY, {"校正": "#a3654a", "修理・不具合対応": "#4c8079", "点検": "#a6863f", "機器設置": "#8a5566", "B掛川": "#4f6f8f"});
      const [statusesKousei, setStatusesKousei, statusKouseiLoaded] = useStorageState(STATUS_KOUSEI_KEY, DEFAULT_STATUSES_KOUSEI);

      const [tableColumnOrder, setTableColumnOrder, tableColLoaded] = useStorageState(TABLE_COL_KEY, DEFAULT_COLUMN_ORDER);
      const [tableHiddenColumns, setTableHiddenColumns, tableHiddenLoaded] = useStorageState(TABLE_HIDDEN_COL_KEY, []);

      // 台帳のタブ(Notionのビューのイメージ): 最初の「受付台帳」タブは常に master(既存のtableHiddenColumns/tableColumnOrder等)を参照し、
      // それ以外は元データはそのままに「表示する列・並び順・ソート・フィルター」だけを個別に持つ追加タブ。
      const [customTableViews, setCustomTableViews, customTableViewsLoaded] = useStorageState(TABLE_VIEWS_KEY, [{"id": "mt54uxn2-psizl3o", "name": "校正", "hiddenColumns": ["workDate", "visitDate", "contactName", "content"], "filters": {"kind": {"query": "校正"}}}, {"id": "mt5503ek-26fwnq2", "name": "修理・点検", "hiddenColumns": ["precheckDate", "honkouseiDate", "contactName", "kind", "code", "personInCharge"], "filters": {"kind": {"query": "", "values": ["修理・不具合対応", "点検"]}}, "columnOrder": ["receivedDate", "status", "subject", "personInCharge", "customer", "storeName", "model", "serialYear", "contactName", "content", "visitDate", "workDate", "tag", "code", "precheckDate", "honkouseiDate", "kind"]}]);
      const [activeTableViewId, setActiveTableViewId] = useState("base");
      const [tableColumnWidths, setTableColumnWidths, tableWidthLoaded] = useStorageState(TABLE_COL_WIDTH_KEY, DEFAULT_COLUMN_WIDTHS);
      const [gasUrl, setGasUrl, gasUrlLoaded] = useStorageState(GAS_URL_KEY, "https://script.google.com/macros/s/AKfycbxvcVpIHVjdq0BrN56Mp1t1ew5JHPrfHfDhMm9SWgU1PGtxM1wtCIBfcIpXPBGrD5D0/exec");
      const [theme, setTheme, themeLoaded] = useStorageState(THEME_KEY, "dark");

      const [syncing, setSyncing] = useState(false);

      const [calCursor, setCalCursor] = useState(() => {
        const t = new Date();
        return { y: t.getFullYear(), m: t.getMonth() };

      const [calAxis, setCalAxis] = useState("all");
      const [searchQuery, setSearchQuery] = useState("");
      const [showEquip, setShowEquip] = useState(null);
      const [showShortcuts, setShowShortcuts] = useState(false);
      const [showStatusAdmin, setShowStatusAdmin] = useState(false);
      const searchInputRef = useRef(null);
      const backupInputRef = useRef(null);

      const [undoStack, setUndoStack] = useState([]);
      const [redoStack, setRedoStack] = useState([]);
      const HISTORY_LIMIT = 50;

      const getStatusesForKind = useCallback((kind) => {
        if (kind === "校正") return statusesKousei;
        return statusesShuuri;
      }, [statusesKousei, statusesShuuri]);

      const pushUndo = () => {
        setUndoStack(prev => [...prev.slice(-HISTORY_LIMIT + 1), { records, codes, dealerGroups, kinds, tags, statusesKousei, statusesShuuri, customerOptions, contactOptions, chargeOptions, modelOptions, customColors }]);
        setRedoStack([]);
      };
      const undo = () => {
        setUndoStack(prev => {
          if (prev.length === 0) return prev;
          const snap = prev[prev.length - 1];
          setRedoStack(r => [...r, { records, codes, dealerGroups, kinds, tags, statusesKousei, statusesShuuri, customerOptions, contactOptions, chargeOptions, modelOptions, customColors }]);
          setRecords(snap.records);
          setCodes(snap.codes);
          setDealerGroups(snap.dealerGroups || DEFAULT_DEALER_GROUPS);
          setKinds(snap.kinds || DEFAULT_KINDS);
          setTags(snap.tags);
          setStatusesKousei(snap.statusesKousei || DEFAULT_STATUSES_KOUSEI);
          setStatusesShuuri(snap.statusesShuuri || DEFAULT_STATUSES_SHUURI);
          setCustomerOptions(snap.customerOptions || []);
          setContactOptions(snap.contactOptions || []);
          setChargeOptions(snap.chargeOptions || []);
          setModelOptions(snap.modelOptions || []);
          setCustomColors(snap.customColors || {});
          return prev.slice(0, -1);
        });
      };
      const redo = () => {
        setRedoStack(prev => {
          if (prev.length === 0) return prev;
          const snap = prev[prev.length - 1];
          setUndoStack(u => [...u, { records, codes, dealerGroups, kinds, tags, statusesKousei, statusesShuuri, customerOptions, contactOptions, chargeOptions, modelOptions, customColors }]);
          setRecords(snap.records);
          setCodes(snap.codes);
          setDealerGroups(snap.dealerGroups || DEFAULT_DEALER_GROUPS);
          setKinds(snap.kinds || DEFAULT_KINDS);
          setTags(snap.tags);
          setStatusesKousei(snap.statusesKousei || DEFAULT_STATUSES_KOUSEI);
          setStatusesShuuri(snap.statusesShuuri || DEFAULT_STATUSES_SHUURI);
          setCustomerOptions(snap.customerOptions || []);
          setContactOptions(snap.contactOptions || []);
          setChargeOptions(snap.chargeOptions || []);
          setModelOptions(snap.modelOptions || []);
          setCustomColors(snap.customColors || {});
          return prev.slice(0, -1);
        });
      };

      const ready = recLoaded && codeLoaded && dealerGroupLoaded && kindsLoaded && tagLoaded && customerOptLoaded && contactOptLoaded && chargeOptLoaded && modelOptLoaded && customColorsLoaded && statusKouseiLoaded && statusShuuriLoaded && hiddenLoaded && boardLayoutLoaded && tableColLoaded && tableHiddenLoaded && tableWidthLoaded && gasUrlLoaded && themeLoaded && customTableViewsLoaded && baseSortLoaded && baseFiltersLoaded;

      // 起動時に、(1)壊れた時刻欄(クラウド連携由来の不正なISO文字列など)をクリーンアップし、
      // (2)期日を過ぎた予定のステータスを自動で前進させる(手動編集を伴わないため、この処理自体は履歴に積まない)
      useEffect(() => {
        if (!ready) return;
        // 過去に保存された列順に、後から追加された列(例: 種別)が含まれていない場合は末尾に補う
        const missingCols = Object.keys(TABLE_COLUMN_DEFS).filter(k => !tableColumnOrder.includes(k));
        if (missingCols.length > 0) {
          setTableColumnOrder([...tableColumnOrder, ...missingCols]);
        }
        let changed = false;
        const next = records.map(r => {
          const cleanedTimes = {
            precheckTime: toHHMM(r.precheckTime),
            visitTime: toHHMM(r.visitTime),
            workTime: toHHMM(r.workTime),
            receivedTime: toHHMM(r.receivedTime),
            honkouseiTime: toHHMM(r.honkouseiTime),
          };
          const timesChanged = Object.keys(cleanedTimes).some(k => cleanedTimes[k] !== (r[k] || ""));
          const base = timesChanged ? { ...r, ...cleanedTimes } : r;
          const updated = computeAutoStatus(base, getStatusesForKind(base.kind || "校正"), kinds);
          if (updated !== r) changed = true;
          return updated;
        });
        if (changed) {
          setRecords(next);
          autoSyncToCloud(next);
        }
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [ready]);

      const getColor = useCallback((val, fallbackIdx = 0) => {
        if (!val) return "var(--clr6b6658)";
        if (customColors[val]) return customColors[val];
        return defaultColorFor(fallbackIdx);
      }, [customColors]);

      const setOptionColor = (val, color) => {
        pushUndo();
        setCustomColors(prev => ({ ...prev, [val]: color }));
      };

      const activeCustomView = activeTableViewId === "base" ? null : customTableViews.find(v => v.id === activeTableViewId);
      const activeHiddenColumns = activeTableViewId === "base" ? tableHiddenColumns : (activeCustomView?.hiddenColumns || []);
      const activeColumnOrder = activeTableViewId === "base" ? tableColumnOrder : (activeCustomView?.columnOrder || tableColumnOrder);
      const activeColumnSort = activeTableViewId === "base" ? baseColumnSort : (activeCustomView?.sort ?? null);
      const activeColumnFilters = activeTableViewId === "base" ? baseColumnFilters : (activeCustomView?.filters || {});

      const setActiveColumnSort = (nextSort) => {
        if (activeTableViewId === "base") {
          setBaseColumnSort(nextSort);
        } else {
          setCustomTableViews(prev => prev.map(v => v.id === activeTableViewId ? { ...v, sort: nextSort } : v));
        }
      };
      const setActiveColumnFilter = (key, conf) => {
        if (activeTableViewId === "base") {
          setBaseColumnFilters(prev => ({ ...prev, [key]: conf }));
        } else {
          setCustomTableViews(prev => prev.map(v => {
            if (v.id !== activeTableViewId) return v;
            return { ...v, filters: { ...(v.filters || {}), [key]: conf } };
          }));
        }
      };
      const clearActiveColumnFilter = (key) => {
        if (activeTableViewId === "base") {
          setBaseColumnFilters(prev => { const n = { ...prev }; delete n[key]; return n; });
        } else {
          setCustomTableViews(prev => prev.map(v => {
            if (v.id !== activeTableViewId) return v;
            const n = { ...(v.filters || {}) }; delete n[key];
            return { ...v, filters: n };
          }));
        }
      };

      // 複合フィルター＆検索(検索・種別による絞り込みなど、台帳/ボード/カレンダー/スマホ画面すべてに共通)
      const filtered = useMemo(() => {
        let list = [...records];
        const q = searchQuery.trim().toLowerCase();
        if (q) {
          list = list.filter(r => {
            const dealer = dealerFor(r.code, dealerGroups);
            const hay = [r.subject, r.kind, r.code, r.tag, dealer?.name, dealer?.customerName, r.note, r.customer, r.contactName, r.personInCharge, r.model, r.content]
              .filter(Boolean).join(" ").toLowerCase();
            return hay.includes(q);
          });
        }
        return list;
      }, [records, searchQuery, dealerGroups]);

      const defaultDateSort = (list) => {
        const next = [...list];
        next.sort((a, b) => {
          const da = a.precheckDate || a.visitDate || a.workDate || "9999";
          const db = b.precheckDate || b.visitDate || b.workDate || "9999";
          if (da !== db) return da.localeCompare(db);
          return (a.precheckTime || a.visitTime || a.workTime || "").localeCompare(b.precheckTime || b.visitTime || b.workTime || "");
        });
        return next;
      };

      // 台帳(テーブル)専用: アクティブなタブのフィルター・ソートを適用する(ボード/カレンダー/スマホ画面には影響しない)
      const tableFiltered = useMemo(() => {
        let list = [...filtered];
        Object.keys(activeColumnFilters).forEach(key => {
          const conf = activeColumnFilters[key];

          if (conf.query && conf.query.trim()) {
            const subQ = conf.query.trim().toLowerCase();
            list = list.filter(r => String(r[key] || "").toLowerCase().includes(subQ));
          }
          if (conf.values && conf.values.length > 0) {
            list = list.filter(r => conf.values.includes(r[key] || ""));
          }
        });
        return list;
      }, [filtered, activeColumnFilters]);

      const tableSorted = useMemo(() => {
        if (activeColumnSort && activeColumnSort.key) {
          const { key, direction } = activeColumnSort;
          const list = [...tableFiltered];
          list.sort((a, b) => {
            const valA = String(a[key] || "");
            const valB = String(b[key] || "");
            const comp = valA.localeCompare(valB, "ja", { numeric: true });
            return direction === "asc" ? comp : -comp;
          });
          return list;
        }
        return defaultDateSort(tableFiltered);
      }, [tableFiltered, activeColumnSort]);

      // ボード/カレンダー/スマホ画面用: 検索のみを反映した既定の日時順(台帳のタブ別フィルター・ソートには影響されない)
      const sorted = useMemo(() => defaultDateSort(filtered), [filtered]);

      // ---------- Enhanced Cloud (GAS) Background Sync ----------
      const autoSyncToCloud = async (currentRecords) => {
        if (!gasUrl.trim()) return;
        try {
          await fetch(gasUrl.trim(), {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ syncRecords: currentRecords }),
          });
        } catch (e) {
          console.error("Auto sync push error:", e);
        }
      };

      const silentFetchFromCloud = useCallback(async () => {
        if (!gasUrl.trim() || syncing) return;
        try {
          const res = await fetch(gasUrl.trim(), {
            method: "GET",
            mode: "cors",
            redirect: "follow"
          });
          if (!res.ok) return;
          const json = await res.json();
          if (json && Array.isArray(json.records) && json.records.length > 0) {
            setRecords(prev => {
              const map = new Map(prev.map(r => [r.id, r]));
              let hasChange = false;
              json.records.forEach(r => {
                if (r.id) {
                  const cleaned = {
                    ...r,
                    precheckDate: toISODate(r.precheckDate),
                    visitDate: toISODate(r.visitDate),
                    workDate: toISODate(r.workDate),
                    receivedDate: toISODate(r.receivedDate),
                    honkouseiDate: toISODate(r.honkouseiDate),
                    precheckTime: toHHMM(r.precheckTime),
                    visitTime: toHHMM(r.visitTime),
                    workTime: toHHMM(r.workTime),
                    receivedTime: toHHMM(r.receivedTime),
                    honkouseiTime: toHHMM(r.honkouseiTime),
                  };
                  const existing = map.get(r.id);
                  if (!existing || JSON.stringify(existing) !== JSON.stringify(cleaned)) {
                    map.set(r.id, cleaned);
                    hasChange = true;
                  }
                }
              });
              return hasChange ? Array.from(map.values()) : prev;
            });
          }
        } catch (e) {
          console.warn("Silent cloud fetch skipped:", e);
        }
      }, [gasUrl, syncing]);

      useEffect(() => {
        if (!gasUrl.trim()) return;
        silentFetchFromCloud();

        const interval = setInterval(() => {
          if (!showForm && !showEquip) {
            silentFetchFromCloud();
          }
        }, 30000);

        const onFocus = () => {
          if (!showForm && !showEquip) {
            silentFetchFromCloud();
          }
        };
        window.addEventListener("focus", onFocus);

        return () => {
          clearInterval(interval);
          window.removeEventListener("focus", onFocus);
        };
      }, [gasUrl, showForm, showEquip, silentFetchFromCloud]);

      const saveRecord = (rec, openEquipAfter = false) => {
        pushUndo();
        const currentKind = rec.kind || "校正";
        const validStatuses = getStatusesForKind(currentKind);
        const defaultStatus = validStatuses[0] || "";

        let targetRecord = null;
        let nextRecords = [];
        if (rec.id) {
          targetRecord = { ...rec, status: rec.status || defaultStatus };
        } else {
          targetRecord = { ...rec, id: uid(), kind: currentKind, status: rec.status || defaultStatus, equipmentSheets: rec.equipmentSheets || [], attachments: rec.attachments || [], receivedDate: rec.receivedDate || toISODate(new Date()) };
        }
        targetRecord = computeAutoStatus(targetRecord, validStatuses, kinds);
        nextRecords = rec.id ? records.map(r => r.id === rec.id ? targetRecord : r) : [...records, targetRecord];
        setRecords(nextRecords);
        autoSyncToCloud(nextRecords);

        // 新規/編集フォームで入力した得意先・営業担当・担当者・型式は、次回から選択肢として使い回せるよう記録する
        if (targetRecord.customer) setCustomerOptions(prev => prev.includes(targetRecord.customer) ? prev : [...prev, targetRecord.customer]);
        if (targetRecord.contactName) setContactOptions(prev => prev.includes(targetRecord.contactName) ? prev : [...prev, targetRecord.contactName]);
        if (targetRecord.personInCharge) setChargeOptions(prev => prev.includes(targetRecord.personInCharge) ? prev : [...prev, targetRecord.personInCharge]);
        if (targetRecord.model) setModelOptions(prev => prev.includes(targetRecord.model) ? prev : [...prev, targetRecord.model]);

        setShowForm(false);
        setEditing(null);

        if (openEquipAfter && targetRecord) {
          setShowEquip(targetRecord);
        }
      };

      const deleteRecord = (id) => {
        if (!window.confirm("この予定を削除しますか？")) return;
        pushUndo();
        const nextRecords = records.filter(r => r.id !== id);
        setRecords(nextRecords);
        autoSyncToCloud(nextRecords);
      };

      const updateRecordField = (id, field, value) => {
        pushUndo();
        if (field === "customer" && value) setCustomerOptions(prev => prev.includes(value) ? prev : [...prev, value]);
        if (field === "contactName" && value) setContactOptions(prev => prev.includes(value) ? prev : [...prev, value]);
        if (field === "personInCharge" && value) setChargeOptions(prev => prev.includes(value) ? prev : [...prev, value]);
        if (field === "model" && value) setModelOptions(prev => prev.includes(value) ? prev : [...prev, value]);
        
        let nextRecords = [];
        if (field === "kind") {
          const nextStatuses = getStatusesForKind(value);
          nextRecords = records.map(r => r.id === id ? { ...r, [field]: value, status: nextStatuses.includes(r.status) ? r.status : nextStatuses[0] } : r);
        } else {
          nextRecords = records.map(r => r.id === id ? { ...r, [field]: value } : r);
        }
        setRecords(nextRecords);
        autoSyncToCloud(nextRecords);
      };

      const updateRecordDateTime = (id, dateField, dateValue, timeField, timeValue, endDateField, endDateValue) => {
        pushUndo();
        const nextRecords = records.map(r => {
          if (r.id !== id) return r;
          const patch = { [dateField]: toISODate(dateValue), [timeField]: timeValue };
          if (endDateField) patch[endDateField] = toISODate(endDateValue) || "";
          const updated = { ...r, ...patch };
          return computeAutoStatus(updated, getStatusesForKind(updated.kind || "校正"), kinds);
        });
        setRecords(nextRecords);
        autoSyncToCloud(nextRecords);
      };

      const saveEquipmentSheets = (recordId, equipmentSheets) => {
        pushUndo();
        const nextRecords = records.map(r => r.id === recordId ? { ...r, equipmentSheets } : r);
        setRecords(nextRecords);
        autoSyncToCloud(nextRecords);
        if (editing && editing.id === recordId) {
          setEditing(prev => ({ ...prev, equipmentSheets }));
        }
      };

      // 添付ファイル(見積書など)の一覧を保存する。ファイル本体はGoogleドライブ側にあり、ここではメタ情報だけ台帳に保持する
      const saveAttachments = (recordId, attachments) => {
        pushUndo();
        const nextRecords = records.map(r => r.id === recordId ? { ...r, attachments } : r);
        setRecords(nextRecords);
        autoSyncToCloud(nextRecords);
        if (editing && editing.id === recordId) {
          setEditing(prev => ({ ...prev, attachments }));
        }
      };

      // ファイルをGAS経由でGoogleドライブへアップロードする(base64で送信し、ファイルIDとプレビュー用URLを受け取る)
      const uploadAttachment = async (recordId, currentAttachments, file) => {
        if (!gasUrl.trim()) {
          alert("先に「クラウド設定」でGASのURLを設定してください");
          return null;
        }
        const dataBase64 = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result).split(",")[1] || "");
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
        const res = await fetch(gasUrl.trim(), {
          method: "POST",
          mode: "cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "uploadAttachment",
            fileName: file.name,
            mimeType: file.type || "application/octet-stream",
            dataBase64,
          }),
        });
        if (!res.ok) throw new Error(`アップロードに失敗しました (HTTP ${res.status})`);
        const json = await res.json();
        if (json && json.status === "error") throw new Error(`GAS側エラー: ${json.error || "不明なエラー"}`);
        if (!json || !json.fileId) throw new Error(`アップロード結果の形式が不正です(受信内容: ${JSON.stringify(json)})`);
        const attachment = {
          id: uid(),
          name: file.name,
          mimeType: file.type || "",
          fileId: json.fileId,
          viewUrl: json.viewUrl || `https://drive.google.com/file/d/${json.fileId}/view`,
          uploadedAt: new Date().toISOString(),
        };
        saveAttachments(recordId, [...currentAttachments, attachment]);
        return attachment;
      };

      const addTag = (name) => {
        if (!name.trim() || tags.includes(name.trim())) return;
        pushUndo();
        setTags([...tags, name.trim()]);
      };
      const removeTag = (name) => {
        pushUndo();
        setTags(tags.filter(t => t !== name));
      };

      const addStatus = (kind, name) => {
        if (!name.trim()) return;
        pushUndo();
        if (kind === "校正") {
          if (!statusesKousei.includes(name.trim())) setStatusesKousei([...statusesKousei, name.trim()]);
        } else {
          if (!statusesShuuri.includes(name.trim())) setStatusesShuuri([...statusesShuuri, name.trim()]);
        }
      };
      const renameStatus = (kind, oldName, newName) => {
        if (!newName.trim() || oldName === newName.trim()) return;
        pushUndo();
        if (kind === "校正") {
          setStatusesKousei(statusesKousei.map(s => s === oldName ? newName.trim() : s));
        } else {
          setStatusesShuuri(statusesShuuri.map(s => s === oldName ? newName.trim() : s));
        }
        const nextRecords = records.map(r => (r.status === oldName && r.kind === kind) ? { ...r, status: newName.trim() } : r);
        setRecords(nextRecords);
        autoSyncToCloud(nextRecords);
      };
      const removeStatus = (kind, name) => {
        const inUse = records.filter(r => r.status === name && r.kind === kind).length;
        if (inUse > 0 && !window.confirm(`「${name}」には${inUse}件の予定が入っています。削除すると未設定に戻ります。よろしいですか？`)) return;
        pushUndo();
        if (kind === "校正") {
          setStatusesKousei(statusesKousei.filter(s => s !== name));
        } else {
          setStatusesShuuri(statusesShuuri.filter(s => s !== name));
        }
        const nextRecords = records.map(r => (r.status === name && r.kind === kind) ? { ...r, status: "" } : r);
        setRecords(nextRecords);
        autoSyncToCloud(nextRecords);
      };
      const reorderStatuses = (kind, fromIdx, toIdx) => {
        if (fromIdx === toIdx) return;
        pushUndo();
        if (kind === "校正") {
          const next = [...statusesKousei];
          const [moved] = next.splice(fromIdx, 1);
          next.splice(toIdx, 0, moved);
          setStatusesKousei(next);
        } else {
          const next = [...statusesShuuri];
          const [moved] = next.splice(fromIdx, 1);
          next.splice(toIdx, 0, moved);
          setStatusesShuuri(next);
        }
      };

      const moveRecordStatus = (recordId, newStatus) => {
        pushUndo();
        const nextRecords = records.map(r => r.id === recordId ? { ...r, status: newStatus } : r);
        setRecords(nextRecords);
        autoSyncToCloud(nextRecords);
      };

      const reorderTableColumns = (fromIdx, toIdx) => {
        if (fromIdx === toIdx) return;
        if (activeTableViewId === "base") {
          const next = [...tableColumnOrder];
          const [moved] = next.splice(fromIdx, 1);
          next.splice(toIdx, 0, moved);
          setTableColumnOrder(next);
        } else {
          setCustomTableViews(prev => prev.map(v => {
            if (v.id !== activeTableViewId) return v;
            const next = [...(v.columnOrder || tableColumnOrder)];
            const [moved] = next.splice(fromIdx, 1);
            next.splice(toIdx, 0, moved);
            return { ...v, columnOrder: next };
          }));
        }
      };
      // 得意先・営業担当・担当者・型式・NSS・種別など、選択肢一覧(プルダウン)の並び順をドラッグで自由に変更するための汎用ヘルパー
      const reorderOptionList = (setter, list) => (fromIdx, toIdx) => {
        if (fromIdx === toIdx) return;
        const next = [...list];
        const [moved] = next.splice(fromIdx, 1);
        next.splice(toIdx, 0, moved);
        setter(next);
      };
      const reorderCustomerOptions = reorderOptionList(setCustomerOptions, customerOptions);
      const reorderContactOptions = reorderOptionList(setContactOptions, contactOptions);
      const reorderChargeOptions = reorderOptionList(setChargeOptions, chargeOptions);
      const reorderModelOptions = reorderOptionList(setModelOptions, modelOptions);
      // 得意先・営業担当・担当者・型式の選択肢一覧から、不要になった項目を削除する(既存案件の値自体はそのまま残る)
      const removeCustomerOption = (opt) => setCustomerOptions(prev => prev.filter(o => o !== opt));
      const removeContactOption = (opt) => setContactOptions(prev => prev.filter(o => o !== opt));
      const removeChargeOption = (opt) => setChargeOptions(prev => prev.filter(o => o !== opt));
      const removeModelOption = (opt) => setModelOptions(prev => prev.filter(o => o !== opt));
      const reorderTags = reorderOptionList(setTags, tags);
      const reorderKindList = reorderOptionList(setKinds, kinds);
      const toggleColumnHidden = (key) => {
        if (activeTableViewId === "base") {
          setTableHiddenColumns(
            tableHiddenColumns.includes(key) ? tableHiddenColumns.filter(k => k !== key) : [...tableHiddenColumns, key]
          );
        } else {
          setCustomTableViews(prev => prev.map(v => {
            if (v.id !== activeTableViewId) return v;
            const hidden = v.hiddenColumns.includes(key) ? v.hiddenColumns.filter(k => k !== key) : [...v.hiddenColumns, key];
            return { ...v, hiddenColumns: hidden };
          }));
        }
      };

      const addTableView = () => {
        const name = window.prompt("新しいタブの名前を入力してください", "新しいビュー");
        if (!name || !name.trim()) return;
        const newView = {
          id: uid(),
          name: name.trim(),
          hiddenColumns: [...activeHiddenColumns],
          columnOrder: [...activeColumnOrder],
          sort: activeColumnSort,
          filters: { ...activeColumnFilters },
        };
        setCustomTableViews(prev => [...prev, newView]);
        setActiveTableViewId(newView.id);
      };
      const renameTableView = (id) => {
        const current = customTableViews.find(v => v.id === id);
        if (!current) return;
        const name = window.prompt("タブの名前を変更", current.name);
        if (!name || !name.trim()) return;
        setCustomTableViews(prev => prev.map(v => v.id === id ? { ...v, name: name.trim() } : v));
      };
      const removeTableView = (id) => {
        if (!window.confirm("このタブを削除しますか？(元データは削除されません)")) return;
        setCustomTableViews(prev => prev.filter(v => v.id !== id));
        if (activeTableViewId === id) setActiveTableViewId("base");
      };
      const setColumnWidth = (key, width) => {
        setTableColumnWidths({ ...tableColumnWidths, [key]: Math.round(width) });
      };
      const toggleStatusHidden = (name, level) => {
        setStatusVisibility({ ...statusVisibility, [name]: level });
      };

      const fetchFromCloud = async () => {
        if (!gasUrl.trim()) {
          setShowCloudConfig(true);
          return;
        }
        setSyncing(true);
        try {
          const res = await fetch(gasUrl.trim(), {
            method: "GET",
            mode: "cors",
            redirect: "follow"
          });
          if (!res.ok) throw new Error(`サーバーエラー (HTTP ${res.status})`);
          const json = await res.json();
          if (json && Array.isArray(json.records)) {
            pushUndo();
            const map = new Map(records.map(r => [r.id, r]));
            json.records.forEach(r => {
              if (r.id) {
                map.set(r.id, {
                  ...r,
                  precheckDate: toISODate(r.precheckDate),
                  visitDate: toISODate(r.visitDate),
                  workDate: toISODate(r.workDate),
                  receivedDate: toISODate(r.receivedDate),
                  honkouseiDate: toISODate(r.honkouseiDate),
                  precheckTime: toHHMM(r.precheckTime),
                  visitTime: toHHMM(r.visitTime),
                  workTime: toHHMM(r.workTime),
                  receivedTime: toHHMM(r.receivedTime),
                  honkouseiTime: toHHMM(r.honkouseiTime),
                });
              }
            });
            const merged = Array.from(map.values());
            setRecords(merged);
            alert(`クラウドから ${json.records.length} 件のデータを取得・統合しました。`);
          } else {
            alert("データの取得に失敗しました。正しいURLか確認してください。");
          }
        } catch (e) {
          console.error(e);
          alert("クラウド通信エラーが発生しました: " + e.message);
        } finally {
          setSyncing(false);
        }
      };

      const pushToCloud = async () => {
        if (!gasUrl.trim()) {
          setShowCloudConfig(true);
          return;
        }
        if (!window.confirm("台帳の全データをクラウド（スプレッドシート）へ上書き送信しますか？")) return;
        setSyncing(true);
        try {
          await fetch(gasUrl.trim(), {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ syncRecords: records }),
          });
          alert("クラウドへの一括バックアップ保存が完了しました。");
        } catch (e) {
          console.error(e);
          alert("クラウド通信エラーが発生しました: " + e.message);
        } finally {
          setSyncing(false);
        }
      };

      const importCodes = (rows) => {
        pushUndo();
        const map = new Map(codes.map(c => [c.code || c.name, c]));
        for (const r of rows) map.set(r.code || r.name, r);
        setCodes(Array.from(map.values()));
        setShowImport(false);
      };

      const exportBackup = () => {
        const data = JSON.stringify({ records, codes, dealerGroups, kinds, tags, statusesKousei, statusesShuuri, customerOptions, contactOptions, chargeOptions, modelOptions, customColors, customTableViews, exportedAt: new Date().toISOString() }, null, 2);
        const blob = new Blob([data], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `kousei-backup-${toISODate(new Date())}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      // カレンダーの内容を「件名・開始日時・終了日時・場所・メモ・詳細」形式のxlsxで書き出す
      // 開始日時: ①日程(事前点検/訪問)を優先、無ければ②日程(本校正/作業)。終了日時: 開始日時と同じ
      const exportScheduleXlsx = () => {
        if (typeof XLSX === "undefined") {
          alert("エクスポート機能の読み込みに失敗しました。通信環境を確認して再読み込みしてください。");
          return;
        }
        const fmtDT = (dateStr, timeStr) => {
          if (!dateStr) return "";
          const d = new Date(dateStr + "T00:00:00");
          if (isNaN(d.getTime())) return "";
          const datePart = `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())}`;
          return timeStr ? `${datePart} ${timeStr}` : datePart;
        };

        const rows = records
          .map(r => {
            let startDate = r.precheckDate || r.visitDate;
            let startTime = r.precheckDate ? r.precheckTime : r.visitTime;
            let endDate = r.precheckDate ? r.precheckEndDate : r.visitEndDate;
            if (!startDate) {
              startDate = r.honkouseiDate || r.workDate;
              startTime = r.honkouseiDate ? r.honkouseiTime : r.workTime;
              endDate = r.honkouseiDate ? r.honkouseiEndDate : r.workEndDate;
            }
            if (!startDate) return null;
            const dt = fmtDT(startDate, startTime);
            const dtEnd = endDate && endDate !== startDate ? fmtDT(endDate, startTime) : dt;
            return {
              "件名": (r.subject || "") + (r.tag ? `_${r.tag}` : ""),
              "開始日時": dt,
              "終了日時": dtEnd,
              "場所": "",
              "メモ・詳細": r.content || "",
              "ID": r.id,
            };
          })
          .filter(Boolean);

        if (rows.length === 0) {
          alert("書き出せる日程がありません");
          return;
        }

        const ws = XLSX.utils.json_to_sheet(rows, { header: ["件名", "開始日時", "終了日時", "場所", "メモ・詳細", "ID"] });
        ws["!cols"] = [{ wch: 24 }, { wch: 18 }, { wch: 18 }, { wch: 24 }, { wch: 30 }, { wch: 16 }];
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
        XLSX.writeFile(wb, `schedule-${toISODate(new Date())}.xlsx`);
      };

      // カレンダーの内容をiCalendar(.ics)形式で書き出す。Outlook/Googleカレンダー/Appleカレンダーがダブルクリックだけで
      // 取り込める標準形式のため、VBAマクロなしで済む。各予定に固有UIDを持たせているので、
      // 同じファイルを再インポートしても重複登録されにくい(同一予定の更新として扱われる)。
      const escapeIcsText = (s) => String(s || "")
        .replace(/\\/g, "\\\\")
        .replace(/;/g, "\\;")
        .replace(/,/g, "\\,")
        .replace(/\r?\n/g, "\\n");

      const foldIcsLine = (line) => {
        // RFC5545: 1行は75オクテット以内が推奨。超える場合は折り返し行の先頭に半角スペースを入れる
        if (line.length <= 75) return line;
        let result = line.slice(0, 75);
        let rest = line.slice(75);
        while (rest.length > 0) {
          result += "\r\n " + rest.slice(0, 74);
          rest = rest.slice(74);
        }
        return result;
      };

      const exportScheduleIcs = () => {
        const pad2 = (n) => String(n).padStart(2, "0");
        const nowUtc = new Date();
        const dtstamp = `${nowUtc.getUTCFullYear()}${pad2(nowUtc.getUTCMonth() + 1)}${pad2(nowUtc.getUTCDate())}T${pad2(nowUtc.getUTCHours())}${pad2(nowUtc.getUTCMinutes())}${pad2(nowUtc.getUTCSeconds())}Z`;

        const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//koeisei-shuuri-daichou//JP", "CALSCALE:GREGORIAN"];
        let count = 0;

        for (const r of records) {
          let startDate = r.precheckDate || r.visitDate;
          let startTime = r.precheckDate ? r.precheckTime : r.visitTime;
          let endDateField = r.precheckDate ? r.precheckEndDate : r.visitEndDate;
          if (!startDate) {
            startDate = r.honkouseiDate || r.workDate;
            startTime = r.honkouseiDate ? r.honkouseiTime : r.workTime;
            endDateField = r.honkouseiDate ? r.honkouseiEndDate : r.workEndDate;
          }
          if (!startDate) continue;
          const [y, mo, da] = startDate.split("-");
          const hasRange = endDateField && endDateField !== startDate;
          const [ey, emo, eda] = hasRange ? endDateField.split("-") : [y, mo, da];

          lines.push("BEGIN:VEVENT");
          lines.push(`UID:${r.id}@koeisei-shuuri-daichou`);
          lines.push(`DTSTAMP:${dtstamp}`);
          if (startTime) {
            const [hh, mm] = startTime.split(":");
            lines.push(`DTSTART:${y}${mo}${da}T${pad2(hh)}${pad2(mm)}00`);
            lines.push(`DTEND:${ey}${emo}${eda}T${pad2(hh)}${pad2(mm)}00`);
          } else {
            // 時刻未入力の場合は終日予定として扱う(DTENDは仕様上、最終日の翌日を指定)
            const endBase = new Date(Number(ey), Number(emo) - 1, Number(eda) + 1);
            const endStr = `${endBase.getFullYear()}${pad2(endBase.getMonth() + 1)}${pad2(endBase.getDate())}`;
            lines.push(`DTSTART;VALUE=DATE:${y}${mo}${da}`);
            lines.push(`DTEND;VALUE=DATE:${endStr}`);
          }
          const summaryText = (r.subject || "（無題）") + (r.tag ? `_${r.tag}` : "");
          lines.push(foldIcsLine(`SUMMARY:${escapeIcsText(summaryText)}`));
          if (r.content) lines.push(foldIcsLine(`DESCRIPTION:${escapeIcsText(r.content)}`));
          lines.push("END:VEVENT");
          count++;
        }
        lines.push("END:VCALENDAR");

        if (count === 0) {
          alert("書き出せる日程がありません");
          return;
        }

        const blob = new Blob([lines.join("\r\n")], { type: "text/calendar;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `schedule-${toISODate(new Date())}.ics`;
        a.click();
        URL.revokeObjectURL(url);
      };

      // 取り込んだ顧客コード表(拠点コード)をCSVで書き出す。ExcelでもBOM付きUTF-8にして文字化けを防ぐ
      const exportCodesCsv = () => {
        if (codes.length === 0) {
          alert("書き出せる顧客コードがありません");
          return;
        }
        const escapeCsv = (v) => {
          const s = String(v ?? "");
          return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
        };
        const rows = [["拠点名", "コード", "得意先グループ略称", "得意先グループ正式名", "得意先"]];
        for (const c of codes) {
          const dealer = dealerFor(c.code, dealerGroups);
          rows.push([
            c.name || "",
            c.code || "",
            dealer ? dealer.abbr : "",
            dealer ? dealer.name : "",
            dealer ? dealer.customerName : "",
          ]);
        }
        const csv = rows.map(r => r.map(escapeCsv).join(",")).join("\r\n");
        const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `customer-codes-${toISODate(new Date())}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const importBackup = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            const validRecords = Array.isArray(parsed.records)
              ? parsed.records.filter(r => r && typeof r === "object" && typeof r.id === "string" && r.id.length > 0)
              : null;
            const invalidCount = Array.isArray(parsed.records) ? parsed.records.length - (validRecords ? validRecords.length : 0) : 0;
            if (validRecords && (invalidCount === 0 || window.confirm(`${invalidCount}件のレコードは形式不正のためスキップされます。続行しますか？`))) {
              parsed.records = validRecords;
              if (window.confirm("現在のデータが上書きされます。復元しますか？")) {
                pushUndo();
                setRecords(parsed.records || []);
                setCodes(parsed.codes || []);
                setDealerGroups(parsed.dealerGroups || DEFAULT_DEALER_GROUPS);
                setKinds(parsed.kinds || DEFAULT_KINDS);
                setCustomTableViews(parsed.customTableViews || []);
                setTags(parsed.tags || DEFAULT_TAGS);
                setStatusesKousei(parsed.statusesKousei || DEFAULT_STATUSES_KOUSEI);
                setStatusesShuuri(parsed.statusesShuuri || DEFAULT_STATUSES_SHUURI);
                setCustomerOptions(parsed.customerOptions || []);
                setContactOptions(parsed.contactOptions || []);
                setChargeOptions(parsed.chargeOptions || []);
                setModelOptions(parsed.modelOptions || []);
                setCustomColors(parsed.customColors || {});
                alert("復元が完了しました。");
              }
            } else {
              alert("正しいバックアップファイル形式ではありません。");
            }
          } catch (err) {
            alert("ファイルの読み込みに失敗しました。");

        };
        reader.readAsText(file);
        e.target.value = "";
      };

      useEffect(() => {
        const isTyping = (el) => el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable);

        const onKeyDown = (e) => {
          if (e.key === "Escape") {
            if (showEquip) { setShowEquip(null); return; }
            if (showForm) { setShowForm(false); setEditing(null); return; }
            if (showQuickAdd) { setShowQuickAdd(false); return; }

            if (showCloudConfig) { setShowCloudConfig(false); return; }
            if (showShortcuts) { setShowShortcuts(false); return; }
            return;
          }

          const meta = e.ctrlKey || e.metaKey;
          if (meta && !e.shiftKey && e.key.toLowerCase() === "z") {
            e.preventDefault(); undo(); return;
          }
          if (meta && ((e.shiftKey && e.key.toLowerCase() === "z") || e.key.toLowerCase() === "y")) {

          if (isTyping(document.activeElement)) return;
          const anyModalOpen = showEquip || showForm || showQuickAdd || showImport || showTagAdmin || showDealerGroupAdmin || showKindAdmin || showStatusAdmin || showColumnAdmin || showCloudConfig || showShortcuts;

            e.preventDefault(); setShowShortcuts(s => !s); return;
          }
        };

        window.addEventListener("keydown", onKeyDown);
        return () => window.removeEventListener("keydown", onKeyDown);
      }, [records, codes, dealerGroups, kinds, tags, statusesKousei, statusesShuuri, customerOptions, contactOptions, chargeOptions, modelOptions, customColors, showEquip, showForm, showQuickAdd, showImport, showTagAdmin, showDealerGroupAdmin, showKindAdmin, showStatusAdmin, showColumnAdmin, showCloudConfig, showShortcuts]);

    function popoverStyleFor(rect, width = 260, estHeight = 280) {
      if (!rect) return null;
      const margin = 12;
      let left = rect.left;
      if (left + width + margin > window.innerWidth) left = Math.max(margin, window.innerWidth - width - margin);
      let top = rect.bottom + 4;
      if (top + estHeight + margin > window.innerHeight) top = Math.max(margin, rect.top - estHeight - 4);
      return { position: "fixed", left, top, width };
    }

    function TextCellPopover({ initialValue, rect, multiline, onSave, onClose }) {
      const [value, setValue] = useState(initialValue || "");
      const inputRef = useRef(null);
      useEffect(() => { inputRef.current?.focus(); if (!multiline) inputRef.current?.select(); }, []);
      const commit = () => { onSave(value); onClose(); };
      return (
        <React.Fragment>
          <div style={styles.cellPopoverBackdrop} onClick={commit} />
          <div style={{ ...styles.cellPopover, ...popoverStyleFor(rect, 280, multiline ? 140 : 50) }} onClick={e => e.stopPropagation()}>

                value={value}
                onChange={e => setValue(e.target.value)}
                onKeyDown={e => {
                  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) commit();
                  if (e.key === "Escape") onClose();
                }}
                onBlur={commit}
              />
            ) : (
              <input
                ref={inputRef}
                style={styles.cellPopoverInput}

                onChange={e => setValue(e.target.value)}
                onKeyDown={e => {

                  if (e.key === "Escape") onClose();

              />
            )}
          </div>

    }

    function DateTimeCellPopover({ initialDate, initialTime, initialEndDate, hasEndDateField, rect, onSave, onClose }) {
      const [date, setDate] = useState(initialDate || "");
      const [time, setTime] = useState(initialTime || "");
      const [endDate, setEndDate] = useState(initialEndDate || "");
      const [showEndDate, setShowEndDate] = useState(!!initialEndDate);
      const [activeField, setActiveField] = useState("start"); // "start" | "end"
      const [cursor, setCursor] = useState(() => {
        const base = initialDate ? new Date(initialDate + "T00:00:00") : new Date();
        return { y: base.getFullYear(), m: base.getMonth() };
      });
      const cells = useMemo(() => monthMatrix(cursor.y, cursor.m), [cursor]);

      const move = (delta) => {
        let nm = cursor.m + delta, ny = cursor.y;
        if (nm < 0) { nm = 11; ny -= 1; }
        if (nm > 11) { nm = 0; ny += 1; }
        setCursor({ y: ny, m: nm });
      };

      const pickDate = (d) => {
        const iso = toISODate(d);
        if (activeField === "end") {
          setEndDate(iso);
          onSave(date, time, iso);
        } else {
          setDate(iso);
          let nextEnd = endDate;
          if (endDate && iso > endDate) { nextEnd = ""; setEndDate(""); }
          onSave(iso, time, nextEnd);
          if (showEndDate) setActiveField("end");
        }
      };

      const changeTime = (t) => {
        setTime(t);
        onSave(date, t, endDate);
      };

      const toggleEndDate = () => {
        if (showEndDate) {
          setEndDate("");
          setShowEndDate(false);
          setActiveField("start");
          onSave(date, time, "");
        } else {
          setShowEndDate(true);
          setActiveField("end");
        }
      };

      const clearAll = () => {
        onSave("", "", "");
        onClose();
      };

      const todayIso = toISODate(new Date());

      return (
        <React.Fragment>
          <div style={styles.cellPopoverBackdrop} onClick={onClose} />
          <div style={{ ...styles.cellPopover, ...popoverStyleFor(rect, 240, hasEndDateField ? 400 : 340) }} onClick={e => e.stopPropagation()}>
            <div style={{ display: "flex", gap: 6, alignItems: "center", marginBottom: 6 }}>
              <input
                type="time"
                style={{ ...styles.cellPopoverInput, flex: 1, textAlign: "center" }}
                value={time || ""}
                onChange={e => changeTime(e.target.value)}
              />
              {time && (
                <button style={styles.iconBtnSm} onClick={() => changeTime("")} title="時刻をクリア">
                  <X size={11} />
                </button>
              )}
            </div>
            <div style={styles.calNav}>
              <button type="button" style={styles.iconBtn} onClick={() => move(-1)}><ChevronLeft size={13} /></button>
              <div style={{ fontSize: 13, fontWeight: 600, color: ink }}>{cursor.y}年 {cursor.m + 1}月</div>
              <button type="button" style={styles.iconBtn} onClick={() => move(1)}><ChevronRight size={13} /></button>
            </div>
            <div style={styles.dtGrid}>
              {["日", "月", "火", "水", "木", "金", "土"].map(d => (
                <div key={d} style={styles.dtDow}>{d}</div>
              ))}
              {cells.map((d, i) => {
                if (!d) return <div key={i} style={styles.dtCellEmpty} />;
                const iso = toISODate(d);
                const isStart = iso === date;
                const isEnd = showEndDate && iso === endDate;
                const inRange = showEndDate && date && iso > date && iso < endDate;
                const isToday = iso === todayIso;
                return (
                  <div
                    key={i}
                    style={{
                      ...styles.dtCell,
                      ...(isToday ? styles.dtCellToday : {}),
                      ...(inRange ? styles.dtCellInRange : {}),
                      ...(isStart ? styles.dtCellSelected : {}),
                      ...(isEnd ? styles.dtCellSelectedEnd : {}),
                    }}
                    onClick={() => pickDate(d)}
                  >
                    {d.getDate()}
                  </div>
                );
              })}
            </div>
            <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
              <button type="button" style={{ ...styles.dtTodayBtn, flex: 1, marginTop: 0 }} onClick={() => pickDate(new Date())}>今日</button>
              <button type="button" style={{ ...styles.dtTodayBtn, flex: 1, marginTop: 0, color: "var(--clrc9573f)" }} onClick={clearAll}>クリア</button>
            </div>

            {hasEndDateField && (
              <React.Fragment>
                <div style={styles.dtEndDateToggleRow}>
                  <span style={{ fontSize: 12.5, color: "var(--clre9e4d8)" }}>終了日</span>
                  <label style={styles.toggleSwitch}>
                    <input type="checkbox" checked={showEndDate} onChange={toggleEndDate} style={{ display: "none" }} />
                    <span style={{ ...styles.toggleTrack, ...(showEndDate ? styles.toggleTrackOn : {}) }}>
                      <span style={{ ...styles.toggleThumb, ...(showEndDate ? styles.toggleThumbOn : {}) }} />
                    </span>
                  </label>
                </div>
                {showEndDate && (
                  <div style={{ display: "flex", gap: 6, marginTop: 6 }}>
                    <button
                      type="button"
                      style={{ ...styles.dtFieldTab, ...(activeField === "start" ? styles.dtFieldTabActive : {}) }}
                      onClick={() => setActiveField("start")}
                    >
                      開始: {date ? fmtJP(date) : "未入力"}
                    </button>
                    <button
                      type="button"
                      style={{ ...styles.dtFieldTab, ...(activeField === "end" ? styles.dtFieldTabActive : {}) }}
                      onClick={() => setActiveField("end")}
                    >
                      終了: {endDate ? fmtJP(endDate) : "未入力"}
                    </button>
                  </div>
                )}
              </React.Fragment>
            )}
          </div>
        </React.Fragment>
      );
    }

    function SelectCellPopover({ value, rect, options, colorFn, onSetColor, allowCreate, onSelect, onClose, onReorder, onRemoveOption }) {
      const [query, setQuery] = useState("");
      const [paletteFor, setPaletteFor] = useState(null);
      const [dragIdx, setDragIdx] = useState(null);
      const [overIdx, setOverIdx] = useState(null);
      const inputRef = useRef(null);
      useEffect(() => { inputRef.current?.focus(); }, []);

      const filtered = options.filter(o => o.toLowerCase().includes(query.trim().toLowerCase()));
      const exactMatch = options.some(o => o.toLowerCase() === query.trim().toLowerCase());
      // 検索中は表示順と実データの並びがズレるため、並び替えは「未検索・全件表示」の時だけ有効にする
      const canReorder = !!onReorder && query.trim() === "" && filtered.length === options.length;

      const pick = (opt) => { onSelect(opt); onClose(); };
      const create = () => {
        if (!query.trim()) return;
        onSelect(query.trim());
        onClose();
      };

      return (
        <React.Fragment>
          <div style={styles.cellPopoverBackdrop} onClick={onClose} />
          <div style={{ ...styles.cellPopover, ...popoverStyleFor(rect, 260, 320) }} onClick={e => e.stopPropagation()}>
            {value && (
              <div style={styles.cellPopoverCurrent}>
                <span style={{ ...styles.pill, background: colorFn(value) }}>{value}</span>
                <button style={styles.searchClear} onClick={() => { onSelect(""); onClose(); }}><X size={12} /></button>
              </div>
            )}
            <input
              ref={inputRef}
              style={styles.cellPopoverInput}
              placeholder="オプションを検索するか作成..."
              value={query}
              onChange={e => setQuery(e.target.value)}
              onKeyDown={e => { if (e.key === "Enter" && query.trim() && !exactMatch && allowCreate) create(); if (e.key === "Escape") onClose(); }}
            />
            <div style={styles.cellPopoverList}>
              {filtered.map((opt, i) => (
                <div
                  key={opt}
                  style={{ ...styles.cellPopoverOptionRow, ...(overIdx === i && dragIdx !== null && dragIdx !== i ? { background: "rgba(198,138,61,0.12)" } : {}) }}
                  draggable={canReorder}
                  onDragStart={() => setDragIdx(i)}
                  onDragOver={(e) => { if (canReorder && dragIdx !== null) { e.preventDefault(); setOverIdx(i); } }}
                  onDrop={(e) => {
                    e.preventDefault();
                    if (canReorder && dragIdx !== null && dragIdx !== i) onReorder(dragIdx, i);
                    setDragIdx(null); setOverIdx(null);
                  }}
                  onDragEnd={() => { setDragIdx(null); setOverIdx(null); }}
                >
                  {canReorder && (
                    <span style={{ cursor: "grab", color: "var(--clr6b6658)", display: "flex", alignItems: "center" }} title="ドラッグで並び替え">
                      <GripVertical size={13} />
                    </span>
                  )}
                  <div style={{ flex: 1, cursor: "pointer" }} onClick={() => pick(opt)}>
                    <span style={{ ...styles.pill, background: colorFn(opt, i) }}>{opt}</span>
                  </div>
                  {onSetColor && (
                    <button
                      style={styles.paletteTriggerBtn}
                      onClick={(e) => { e.stopPropagation(); setPaletteFor(paletteFor === opt ? null : opt); }}
                      title="色を変更"
                    >
                      <Palette size={12} color="var(--clr948d7c)" />
                    </button>
                  )}
                  {onRemoveOption && (
                    <button
                      style={styles.paletteTriggerBtn}
                      onClick={(e) => {
                        e.stopPropagation();
                        if (window.confirm(`「${opt}」をこの選択肢一覧から削除しますか？(すでに使われている案件の値はそのまま残ります)`)) {
                          onRemoveOption(opt);
                        }
                      }}
                      title="この選択肢を削除"
                    >
                      <Trash2 size={12} color="var(--clr948d7c)" />
                    </button>
                  )}
                  {paletteFor === opt && (
                    <div style={styles.inlineColorPicker}>
                      {CATEGORY_PALETTE.map(c => (
                        <span
                          key={c}
                          style={{ ...styles.colorDot, background: c, border: colorFn(opt, i) === c ? "2px solid #fff" : "1px solid rgba(0,0,0,0.4)" }}
                          onClick={(e) => { e.stopPropagation(); onSetColor(opt, c); setPaletteFor(null); }}
                        />
                      ))}
                    </div>
                  )}
                </div>
              ))}
              {allowCreate && query.trim() && !exactMatch && (
                <div style={styles.cellPopoverCreate} onClick={create}>
                  <Plus size={12} /> 「{query.trim()}」を作成
                </div>
              )}
            </div>
          </div>
        </React.Fragment>
      );
    }
